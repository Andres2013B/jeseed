<style>

/* Layout: una sola pantalla sin pestañas. Arriba: tu gota. Centro: baraja de retos que se desliza. Abajo: el manantial (agua fija) con tu bolsa de retos y el botón "Sumar mi gota". */
:root{
  --bg:#F7F6F3; --surface:#FFFFFF; --ink:#2B1D3F; --muted:#6F6381; --line:#E8E2EF;
  --primary:#5B3A8C; --primary-deep:#43286B; --on-primary:#FFFFFF;
  --lime:#A6D45C; --lime-deep:#5E8A1F; --lime-tint:#EEF5E1; --lav:#F1ECF8;
  --sun:#FFC93C; --sun-deep:#C98A00; --coral:#FF6B4A; --sky:#3DA5FF; --mint:#2EC4B6; --lilac:#A77BFF; --leaf:#7CC85A;
  --sun-ink:#2A1F3D; --water:#3DA5FF; --water-deep:#2B59C3; --water-ink:#0E2350; --ok:#1F8A5B; --warn:#B4530F; --bad:#C2352B;
  --font:'DM Sans',ui-sans-serif,'Segoe UI',system-ui,sans-serif;--font-h:'Manrope','DM Sans',ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15111D; --surface:#211A2D; --ink:#F4EFFA; --muted:#BCB1CC; --line:#3A3150;
  --primary:#BFA3EC; --primary-deep:#9878CF; --on-primary:#1B1327;
  --lime:#B5DE73; --lime-deep:#B5DE73; --lime-tint:#25301B; --lav:#2A2238;
  --water:#2F7FD0; --water-deep:#1E4FA0; --water-ink:#FFF3DE; --ok:#5FD39A; --warn:#FFB26B; --bad:#FF8A7A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15111D; --surface:#211A2D; --ink:#F4EFFA; --muted:#BCB1CC; --line:#3A3150;
  --primary:#BFA3EC; --primary-deep:#9878CF; --on-primary:#1B1327;
  --lime:#B5DE73; --lime-deep:#B5DE73; --lime-tint:#25301B; --lav:#2A2238;
  --water:#2F7FD0; --water-deep:#1E4FA0; --water-ink:#FFF3DE; --ok:#5FD39A; --warn:#FFB26B; --bad:#FF8A7A; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.12;font-weight:900}
p{margin:0}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 390px;display:flex;flex-direction:column;gap:14px}
/* Encabezado: tu gota */
.me{display:flex;align-items:center;gap:10px;background:none;border:none;padding:0;cursor:pointer;text-align:left;width:100%}
.me .hi{flex:1;min-width:0}
.me .hi b{display:block;font-size:20px;font-weight:900}
.me .hi span{font-size:13px;font-weight:800;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-weight:900;font-size:15px}
.stat2{flex-direction:row;flex-wrap:wrap;justify-content:center;line-height:1.05;padding:5px 10px}
.stat2 small{flex-basis:100%;text-align:center;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.3px}
.role{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-size:12px}
.fest{display:flex;align-items:center;gap:12px;width:100%;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:10px 14px;cursor:pointer;text-align:left;font-weight:800}
.fest .n{flex:none;min-width:48px;height:48px;border-radius:14px;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;font-size:20px;font-weight:900;line-height:1;text-align:center;padding:4px}
.fest .n small{display:block;font-size:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px;cursor:pointer;min-height:40px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* Baraja */
.deck{position:relative;height:470px;touch-action:pan-y}
.dcard{position:absolute;inset:0;overflow:hidden;border-radius:30px;padding:22px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--c) 30%,var(--surface));border:1px solid var(--line);box-shadow:var(--sh);user-select:none;transition:transform .35s cubic-bezier(.2,.9,.3,1),opacity .3s;will-change:transform}
.dcard.b1{transform:translateY(16px) scale(.94);z-index:1}
.dcard.b2{transform:translateY(32px) scale(.88);z-index:0;opacity:.8}
.dcard.front{z-index:3;cursor:grab;transform-origin:50% 115%}
.dcard.front.dragging{transition:none;cursor:grabbing}
.dcard .ico{width:52px;height:52px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.dcard h2{font-size:28px;letter-spacing:-.4px}
.dcard p{font-weight:700;font-size:16px}
.dcard .meta{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:900;font-size:13px}
.ribbon{position:absolute;right:18px;top:18px;background:var(--ink);color:var(--bg);font-weight:900;font-size:12px;letter-spacing:1.2px;border-radius:999px;padding:6px 12px}
.stamp{position:absolute;top:26px;font-weight:900;font-size:24px;letter-spacing:1px;border:4px solid currentColor;border-radius:14px;padding:4px 12px;opacity:0;pointer-events:none;background:var(--surface)}
.stamp.yes{left:20px;color:var(--ok);transform:rotate(-12deg)}
.stamp.no{right:20px;color:var(--bad);transform:rotate(12deg)}
.deck-btns{display:flex;justify-content:center;align-items:flex-start;gap:18px}
.rb{display:grid;grid-template-rows:100px auto;justify-items:center;align-items:center;row-gap:2px;min-width:80px}.rb>span{font-size:13px;font-weight:900;color:var(--ink,inherit);text-align:center;line-height:1.1}
.dcard.front.swdemo{animation:swdemo 2.4s ease-in-out .4s 1 !important}
@keyframes swdemo{0%,100%{translate:0;rotate:0deg}25%{translate:60px 0;rotate:6deg}55%{translate:-60px 0;rotate:-6deg}80%{translate:0;rotate:0deg}}
.swhand{position:absolute;left:50%;bottom:22%;font-size:42px;transform:translateX(-50%);pointer-events:none;animation:swhand 2.4s ease-in-out .4s 1;filter:drop-shadow(0 4px 6px #0003);z-index:5}
@keyframes swhand{0%,100%{transform:translateX(-50%)}25%{transform:translateX(10%)}55%{transform:translateX(-110%)}80%{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.swdemo,.swhand{animation:none}}
.round{width:68px;height:68px;border-radius:34px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;box-shadow:var(--sh);transition:transform .08s,box-shadow .08s}
.round:active{transform:translateY(4px);box-shadow:var(--sh)}
.round.yes{width:84px;height:84px;border-radius:42px;background:var(--primary);border-color:var(--primary-deep);box-shadow:var(--sh-p)}
.round.info{width:52px;height:52px;border-radius:26px}
.hint{font-size:13px;color:var(--muted);font-weight:700}
.center{text-align:center}
/* Manantial fijo abajo */
.spring{position:fixed;left:0;right:0;bottom:0;z-index:6;pointer-events:none}
.spring .water{position:absolute;left:0;right:0;bottom:0;height:var(--wh,250px);transition:height 1.4s cubic-bezier(.2,.8,.2,1)}
.spring .water .w{position:absolute;left:0;width:200%;height:26px;animation:wave 5s linear infinite}
.spring .water .w.w1{top:-22px}
.spring .water .w.w2{top:-16px;animation-duration:8s;opacity:.6}
.spring .water .body{position:absolute;inset:2px 0 0;background:var(--water)}
.spring .bub{position:absolute;bottom:0;border-radius:50%;background:rgba(255,255,255,.35);animation:bub 7s ease-in infinite}
.spring .inner{position:relative;max-width:480px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;pointer-events:auto}
.wl{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--water-ink)}
.wl button{background:none;border:none;color:var(--water-ink);font-weight:900;cursor:pointer;padding:6px 0;min-height:40px;text-align:left}
.story{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:800!important;opacity:.95}
.tray{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;min-height:52px;align-items:center;justify-content:safe center}
.tdrop{flex:none;display:flex;align-items:center;gap:8px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:8px 12px;font-weight:800;font-size:14px;cursor:pointer;max-width:220px;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both;min-height:48px}
.tdrop span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdrop.review{opacity:.75;border-style:dashed}
.tdrop.fix{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn) inset}
.tray .empty{color:var(--water-ink);font-weight:800;font-size:14px;opacity:.95}

/* ===== Diseño unido Andrés × Nathan ===== */
:root{--sh:0 1px 2px rgba(43,29,63,.06),0 6px 20px rgba(43,29,63,.07);--sh-p:0 6px 18px rgba(91,58,140,.26);--r:20px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--sh-p:0 6px 18px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--sh-p:0 6px 18px rgba(0,0,0,.45)}
body{font-weight:500;letter-spacing:-.005em}
h1,h2,h3,.sheet h2,.dcard h2,.ld-sec h2,.sn-txt b,.brandbar span,.me .hi b{font-family:var(--font-h);font-weight:800;letter-spacing:-.025em}
b,strong{font-weight:700}
.card,.sheet,.dcard,.rolecard,.lvmini,.lv,.season{border-radius:var(--r)}
.card{border:1px solid var(--line);box-shadow:var(--sh)}
.btn{border-radius:14px;font-weight:700;letter-spacing:-.01em;transition:transform .15s ease,background .2s}
.btn:not(.ghost){background:var(--primary);color:var(--on-primary);box-shadow:var(--sh-p);border-color:transparent}
.btn:not(.ghost):hover{background:var(--primary-deep)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh)}
.btn:active{transform:translateY(1px)}
.chip,.seg button,.pill{font-weight:700}
.chip.on,.seg button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.in{border-radius:12px}
.in:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 22%,transparent)}
:focus-visible{outline-color:var(--lime)}
.notice{background:var(--lav);border:1px solid var(--line)}
.brandbar{background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);box-shadow:none}
.bb-logo{flex:none;object-fit:contain}
.status{font-weight:700}
.status.approved{background:var(--lime-tint);color:var(--lime-deep);border-color:transparent}
#demobar:not([hidden]){background:var(--lav);color:var(--ink);border-bottom:1px solid var(--line)}
#demobar .linkbtn{color:var(--primary)}
.season{border:1px solid color-mix(in srgb,var(--fc) 70%,#000 0%);box-shadow:var(--sh)}
/* Corazón + manantial */
.hero2{display:grid;grid-template-columns:1fr;gap:12px}
.hero2:empty,#owncta:empty{display:none}
.hc{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;position:relative;min-width:0}
.hc:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.hc-heart .hc-ring{flex:none}
.hc-n{position:absolute;left:16px;width:92px;height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.hc-n b{font-family:var(--font-h);font-weight:800;font-size:22px;color:var(--primary)}.hc-n small{font-size:10.5px;color:var(--muted);margin-top:3px}
.hc-tx{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.hc-tx .eyebrow{font-size:10.5px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.hc-tx b{font-family:var(--font-h);font-weight:800;font-size:18px;letter-spacing:-.02em}
.hc-tx>span{font-size:13.5px;color:var(--muted)}
.hc-spring{background:linear-gradient(180deg,var(--surface) 55%,color-mix(in srgb,var(--water) 12%,var(--surface)))}
.hc-bar{display:block;height:10px;border-radius:99px;background:color-mix(in srgb,var(--water) 16%,var(--surface));overflow:hidden;margin-top:6px}.hc-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--water),var(--water-deep))}
@media (min-width:560px){.hero2{grid-template-columns:1fr 1fr}}
/* ¿Ya hiciste una buena acción? */
.owncard{display:flex;align-items:center;gap:14px;background:var(--lime-tint);border:1px solid color-mix(in srgb,var(--lime) 45%,var(--line));border-radius:var(--r);padding:14px 16px}
.oc-plus{flex:none;width:44px;height:44px;border-radius:14px;background:color-mix(in srgb,var(--lime) 35%,var(--surface));display:grid;place-items:center;color:var(--lime-deep)}
.oc-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.oc-tx .eyebrow{font-size:10.5px;letter-spacing:.14em;color:var(--lime-deep);font-weight:700}
.oc-tx b{font-family:var(--font-h);font-weight:800;font-size:18px;letter-spacing:-.02em}.oc-tx span{font-size:13.5px;color:var(--muted)}
.owncard .btn{flex:none}
@media (max-width:520px){.owncard{flex-wrap:wrap}.owncard .btn{width:100%}}
/* Barra lateral */
#sidenav{display:none}
#sidenav .sn-brand{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 0 18px;line-height:1.15}
#sidenav .sn-brand small{font-size:10px;letter-spacing:.2em;color:var(--muted);font-weight:700}
#sidenav .sn-brand b{font-family:var(--font-h);font-weight:800;font-size:21px;color:var(--primary);letter-spacing:.03em}
.sn-i{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:11px 14px;border-radius:14px;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer;text-align:left;font-family:var(--font)}
.sn-i:hover{background:var(--lav);color:var(--ink)}
.sn-i.on{background:var(--lav);color:var(--primary);font-weight:700}
.sn-i span{flex:1;min-width:0}
.nb{font-style:normal;background:var(--primary);color:var(--on-primary);font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px}
.sn-sec{margin-top:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700;font-size:14px}
.sn-sec i{width:8px;height:8px;border-radius:50%;background:var(--primary);flex:none}
.sn-tag{font-family:var(--font-h);font-weight:700;font-size:17px;line-height:1.3;padding:12px 6px 2px;letter-spacing:-.02em}.sn-tag span{color:var(--lime-deep)}
.sn-cr{font-size:11px;color:var(--muted);padding:0 6px}
@media (min-width:1180px){
 body.sb-on #sidenav{display:flex;flex-direction:column;gap:2px;position:fixed;inset:0 auto 0 0;width:248px;z-index:30;padding:22px 16px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
 body.sb-on .brandbar,body.sb-on #demobar,body.sb-on .app{margin-left:248px}
 body.sb-on .app{max-width:none;padding-left:40px;padding-right:40px}
 body.sb-on .spring{left:248px}
 body.sb-on .brandbar>.bb-logo,body.sb-on .brandbar>span:not(.bb-r){visibility:hidden}
 body.sb-on .ptabs{display:none}
}
/* Barra de abajo (celular, alumnos) */
#tabbar{display:none}
@media (max-width:1179px){
 body.tb-on #tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
 body.tb-on .spring{bottom:calc(62px + env(safe-area-inset-bottom,0px))}
 html:has(body.tb-on){scroll-padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
 body.tb-on .app{padding-bottom:460px}
 body.tb-on .layer-pad{padding-bottom:62px}
}
.tb-i{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;padding:4px 2px;position:relative;font-family:var(--font)}
.tb-i svg{width:44px;height:28px;padding:4px 12px;border-radius:12px;box-sizing:border-box}
.tb-i.on{color:var(--primary)}.tb-i.on svg{background:var(--lav)}
.tb-i .nb{position:absolute;top:0;left:calc(50% + 6px);font-size:10px;padding:0 6px}
body.tv #sidenav,body.tv #tabbar{display:none!important}
@media print{#sidenav,#tabbar{display:none!important}}
/* Pantalla completa desde el menú */
.sheet-bg.pg{background:var(--bg);align-items:stretch!important;justify-content:stretch;padding:0!important;animation:fade .15s both}
.sheet.pg{width:100%!important;max-width:none!important;max-height:none!important;height:100%;border-radius:0!important;padding:28px max(18px,calc((100% - 980px)/2)) 48px!important;animation:none;box-shadow:none;background:var(--bg)}
@media (min-width:1180px){body.sb-on .sheet-bg.pg{left:248px}}
@media (max-width:1179px){body.tb-on .sheet-bg.pg{bottom:calc(62px + env(safe-area-inset-bottom,0px))}body.tb-on .sheet.pg{padding-bottom:32px!important}}
/* Necesito una mano */
.hp-ic{flex:none;width:44px;height:44px;border-radius:14px;background:var(--lime-tint);color:var(--lime-deep);display:grid;place-items:center}
.hp-bar{height:8px;border-radius:99px;background:var(--lime-tint);overflow:hidden}.hp-bar i{display:block;height:100%;background:var(--lime);border-radius:99px}
.btn.lime:not(.ghost){background:var(--lime);color:#22301A;box-shadow:none}
#helpcard:empty{display:none}
/* Gráfica por mes */
.mchart{display:flex;gap:10px;align-items:flex-end;height:120px}
.mchart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:12px;color:var(--muted);font-weight:600;text-transform:capitalize}
.mchart i{width:100%;border-radius:8px;background:var(--lav)}.mchart .mv{font-weight:700;color:var(--ink)}
/* Tutorial */
.tut{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:8px 4px}
.tut-ic{width:76px;height:76px;border-radius:24px;background:var(--lav);display:grid;place-items:center}
.tut-dots{display:flex;gap:6px;margin:4px 0 8px}.tut-dots i{width:8px;height:8px;border-radius:99px;background:var(--line)}.tut-dots i.on{width:22px;background:var(--primary)}
/* Corazón */
.hc-heart .hc-n{top:50%;transform:translateY(-44%);height:auto}
.hc-heart .hc-n b{color:#fff;text-shadow:0 1px 3px rgba(43,29,63,.45)}
.hc-heart .hc-n small{color:#fff;opacity:.92;text-shadow:0 1px 2px rgba(43,29,63,.45)}
.hc-heart.low .hc-n b{color:var(--primary);text-shadow:none}.hc-heart.low .hc-n small{color:var(--muted);text-shadow:none;opacity:1}
.hrt{filter:drop-shadow(0 6px 10px color-mix(in srgb,var(--primary) 28%,transparent))}
.hrt-w1{animation:hwave 3.2s linear infinite}.hrt-w2{animation:hwave 4.6s linear infinite reverse;opacity:.8}
@keyframes hwave{to{transform:translateX(50px)}}
.hc-heart:hover .hrt{animation:hbeat .9s ease-in-out}
@keyframes hbeat{25%{transform:scale(1.08)}50%{transform:scale(.97)}75%{transform:scale(1.04)}}
/* Nube → gota → cubeta → corazón */
.hfx{position:fixed;inset:0;z-index:90;background:color-mix(in srgb,var(--ink) 35%,transparent);backdrop-filter:blur(5px);display:grid;place-items:center;padding:16px;animation:fade .25s both}
.hfx.out{animation:fadeo .25s both}@keyframes fadeo{to{opacity:0}}
.hfx-card{background:var(--surface);border-radius:28px;box-shadow:0 30px 80px rgba(43,29,63,.35);padding:22px 24px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;width:min(420px,100%);animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.85) translateY(16px);opacity:0}}
.hfx-svg{width:100%;height:auto;overflow:visible}
.hfx-t{font-family:var(--font-h);font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1.2;animation:rise .4s 3.6s both}
.hfx-s{color:var(--muted);font-weight:600;animation:rise .4s 3.75s both}.hfx-n{color:var(--primary);font-weight:800}
.hfx-card .btn{margin-top:6px;min-width:140px;animation:rise .4s 3.9s both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.fx-cloud{animation:cloudin .7s cubic-bezier(.2,1.2,.4,1) both,bob 2.4s .7s ease-in-out infinite}
@keyframes cloudin{from{transform:translate(-40px,-10px);opacity:0}}@keyframes bob{50%{transform:translateY(-5px)}}
.fx-drop{transform-box:fill-box;transform-origin:50% 0;animation:dform .4s .6s ease-out both,dfall .55s 1s cubic-bezier(.6,0,.9,.6) both}
@keyframes dform{from{transform:scale(0)}}@keyframes dfall{to{transform:translateY(88px) scaleY(1.15);opacity:0}}
.fx-splash circle{opacity:0;transform-box:fill-box;animation:splash .5s 1.5s ease-out both}
.fx-splash circle:nth-child(1){--sx:-10px}.fx-splash circle:nth-child(2){--sx:10px}.fx-splash circle:nth-child(3){--sx:0px}
@keyframes splash{0%{opacity:0;transform:none}15%{opacity:1}100%{opacity:0;transform:translate(var(--sx),-18px)}}
.fx-bw,.fx-bwv{transform-box:view-box;animation:bfill .6s 1.5s ease-out both,bempty 1.2s 2.7s ease-in forwards}
@keyframes bfill{from{transform:translateY(26px)}}@keyframes bempty{from{transform:none}to{transform:translateY(34px)}}
.fx-bwv{animation:bfill .6s 1.5s ease-out both,bempty 1.2s 2.7s ease-in forwards}
@keyframes bwave{to{transform:translateX(32px)}}
.fx-bucket{transform-box:fill-box;transform-origin:85% 95%;animation:lift 2.2s 2s ease-in-out both}
@keyframes lift{0%{transform:none}25%{transform:translateY(-14px) rotate(48deg)}75%{transform:translateY(-14px) rotate(48deg)}100%{transform:none}}
.fx-stream{stroke-dasharray:140;stroke-dashoffset:140;opacity:0;animation:pour 1.6s 2.45s ease-in-out both}
@keyframes pour{0%{opacity:1;stroke-dashoffset:140}35%{stroke-dashoffset:0}70%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:-140}}
.fx-drips circle{opacity:0;animation:drip .5s ease-in both}.fx-drips circle:nth-child(1){animation-delay:2.9s}.fx-drips circle:nth-child(2){animation-delay:3.2s}
@keyframes drip{0%{opacity:0}15%{opacity:1}100%{opacity:0;transform:translateY(16px)}}
.fx-lvl{transform:translateY(var(--y0));animation:lvl 1.5s 2.6s cubic-bezier(.3,.8,.3,1) both}
@keyframes lvl{to{transform:translateY(var(--y1))}}
.fx-heart{transform-box:fill-box}
.fx-heart>*{transform-box:view-box}
.fx-heart.full,.fx-heart{animation:none}
.fx-spark path{opacity:0;transform-box:fill-box;transform-origin:center;animation:spark 1.1s ease-out both}
@keyframes spark{0%{opacity:0;transform:scale(0) rotate(0)}40%{opacity:1;transform:scale(1.8) rotate(45deg)}100%{opacity:0;transform:scale(.8) rotate(110deg)}}
.hfx-beat{animation:hbeat .8s 3.4s ease-in-out 2}
@media (prefers-reduced-motion:reduce){.hfx *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}

.rankseg{display:inline-flex;flex:none;align-self:flex-start;background:var(--lav);border-radius:14px;padding:4px;gap:4px;border:0}.rankseg button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;border-radius:11px;padding:9px 16px;font-weight:700;color:var(--muted);cursor:pointer}.rankseg button.on{background:var(--surface);color:var(--primary);box-shadow:var(--sh)}

/* ===== Pulido general ===== */
/* barra de arriba: nombre de la pantalla */
.bb-page{display:none}

 body.sb-on .brandbar>.bb-logo,body.sb-on .brandbar>span:not(.bb-r):not(.bb-page){display:none}

/* el manantial de abajo: solo una ola decorativa (lo demás ya está arriba y en Comunidad) */

.sn-badge{background:var(--fc);color:#fff}

.qbtn{border-radius:var(--r)!important}

.srcmark{color:var(--lime-deep);text-transform:none;letter-spacing:0;font-weight:700}

/* Historias: galería de fotos */

.btn.mic.rec{background:color-mix(in srgb,var(--coral) 14%,var(--surface));border-color:var(--coral);color:var(--ink);animation:recp 1.2s ease-in-out infinite}
.btn.mic.rec svg{stroke:var(--coral)}
@keyframes recp{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--coral) 18%,transparent)}}
body.kinder .btn.mic,.kidmic .btn.mic{font-size:17px;padding:14px 18px}
/* Pasaporte */
.pass-mini{display:flex;flex-wrap:wrap;gap:6px}
.pass-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;margin-top:6px}
.pass-cell{margin:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 8px}
.pass-cell figcaption{font-weight:800;font-family:var(--font-h);font-size:15px}.pass-cell small{display:block;font-family:var(--font);font-weight:600;font-size:12px;color:var(--muted)}
.fstamp{display:block;flex:none}.fstamp.got{filter:drop-shadow(0 3px 6px rgba(43,29,63,.12))}
.passdoc{display:flex;flex-direction:column;gap:12px}
@media print{.pass-cell{break-inside:avoid;border-color:#ccc}}
/* Pareja */
.paircard{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:color-mix(in srgb,var(--lime) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--lime) 45%,var(--line));border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.paircard .pc-ic{flex:none;width:44px;height:44px;border-radius:14px;background:var(--surface);display:grid;place-items:center;color:var(--lime-deep)}
.paircard .pc-tx{flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px}.paircard .pc-tx .eyebrow{font-size:10.5px;letter-spacing:.14em;color:var(--lime-deep);font-weight:700}.paircard .pc-tx b{font-family:var(--font-h);font-weight:800;font-size:16px}.paircard .pc-tx>span{font-size:13.5px;color:var(--muted)}
#pairbox:empty{display:none}
.lvneed{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
/* Imprimir solo el documento (resumen del mes, constancia) */
@media print{body>*:not(#layer){display:none!important}#layer .sheet-bg{position:static!important;background:none!important;display:block!important}#layer .sheet{max-height:none!important;height:auto!important;overflow:visible!important;box-shadow:none!important;width:100%!important;padding:0!important}#layer .sheet>*:not(.printme):not(.cert){display:none!important}.printme .card{box-shadow:none}}

/* Une el catálogo guardado con los retos nuevos del código (sin revivir los que coordinación borró) */
function mergeCat(c,del){if(!Array.isArray(c)||!c.length)return JSON.parse(JSON.stringify(R));c=c.filter(x=>x&&!RDEL.includes(x.id));c.forEach(x=>{if(RFIX[x.id])Object.assign(x,RFIX[x.id])});c.forEach(x=>{if(x&&x.fest&&!x.ages){const o=R.find(r=>r.id===x.id);if(o&&o.ages)x.ages=o.ages.slice()}});const have=new Set(c.map(x=>x.id)),gone=new Set(del||[]);return c.concat(JSON.parse(JSON.stringify(R.filter(r=>r.id>=601&&r.id<1400&&!have.has(r.id)&&!gone.has(r.id)))))}
/* Cómo hacer cada reto: tres pasos */
const HOW={
'Saluda con una sonrisa':['Al entrar al salón, busca a tu maestra con la mirada.','Sonríe y dile «¡Buenos días!» con su nombre.','Elige a un compañero y salúdalo también.'],

'Te presto mis crayolas':['Mira si algún compañero no tiene el color que necesita.','Pregúntale: «¿quieres usar el mío?».','Espera con paciencia a que te lo regrese.'],
'Ayuda a recoger':['Si a alguien se le cae algo, acércate.','Ayúdale a levantarlo y dáselo en la mano.','Pregúntale si está bien.'],
'Ven a jugar':['En el recreo, busca a un compañero que esté solo.','Acércate y dile: «¿quieres jugar conmigo?».','Explícale el juego y déjalo tener su turno.'],
'Pide perdón':['Si alguien se lastimó por algo que hiciste, acércate.','Dile «perdón, no quise hacerlo».','Pregúntale si está bien y avisa a tu maestra si necesita ayuda.'],

'Cuida a tu mascota o planta':['Elige con un adulto una mascota o una planta.','Cada día de la semana, dale agua a la misma hora.','Al final, cuéntale a tu familia cómo la cuidaste.'],

'Agua para las plantas':['Pregunta a tu maestra si la planta necesita agua.','Riégala con cuidado, sin mojar el piso.','Otro día, revisa si sigue bonita.'],

'Tú primero':['En la fila o en el juego, mira quién está detrás de ti.','Dile «pásale tú primero».','Espera tranquilo a que sea tu turno.'],

'Guía del salón':['Pregunta a tu maestra si hay un compañero nuevo.','Dile tu nombre y pregúntale el suyo.','Enséñale dónde están el baño, los juguetes y su lugar.'],
'Cuentacuentos':['Elige con tu maestra un cuento con dibujos.','Siéntate junto a un compañero y cuéntaselo con los dibujos.','Pregúntale qué parte le gustó más.'],
'Saluda por su nombre':['Piensa en alguien del colegio con quien casi no hablas.','Si no sabes su nombre, pregúntaselo.','Salúdalo por su nombre hoy y también mañana.'],
'Gracias de verdad':['Fíjate quién te ayuda hoy: un maestro, un compañero o alguien del colegio.','Míralo a los ojos y dile «gracias».','Agrega en qué te ayudó: «gracias por explicarme».'],
'¿Juegas conmigo?':['En el recreo, busca a alguien que esté solo.','Acércate y pregúntale si quiere jugar contigo.','Preséntalo con tus amigos y explícale el juego.'],
'Un elogio con detalle':['Fíjate en algo que un compañero hace muy bien.','Díselo con detalle: «te salen increíbles los dibujos de caballos».','Que sea de verdad, no por cumplir.'],
'Defiende con respeto':['Si alguien se burla de otro, no te rías.','Di con calma: «eso no está bien».','Si sigue pasando, avisa a un maestro. Pedir ayuda también es ayudar.'],
'Da el primer paso':['Piensa en alguien con quien te peleaste.','Búscalo y dile: «¿lo arreglamos?».','Escucha su lado y pide perdón por tu parte.'],
'Sorpresa en tu cuarto':['Al levantarte, tiende tu cama.','Recoge la ropa y los juguetes de tu cuarto.','No lo anuncies: deja que lo descubran.'],
'Mi lista de gracias':['Antes de cenar, escribe tres cosas buenas de tu día.','Elige la que más te importe.','Compártela en la mesa con tu familia.'],
'Cuando mis abuelos iban a la escuela':['Llama o visita a tus abuelos, sin pantallas cerca.','Pregúntales cómo era su escuela y a qué jugaban.','Escucha y hazles al menos dos preguntas más.'],
'Ayuda en la cocina':['Pregunta en qué puedes ayudar con la cena.','Lava, mide o pon la mesa, según te digan.','Al final, ayuda a recoger.'],
'Un día de ayudante':['Elige un día del fin de semana.','Ofrece ayuda en cada tarea que veas: platos, ropa, compras.','En la noche, cuéntale a tu familia qué hiciste.'],
'Dona lo que ya no usas':['Con tu familia, revisa tu ropa y tus juguetes.','Separa lo que esté en buen estado y ya no uses.','Llévenlo juntos a la colecta del colegio o a una fundación.'],
'Gracias por escrito':['Elige a alguien del colegio a quien casi nadie le da las gracias.','Escribe una nota corta: qué hace y por qué te ayuda.','Entrégasela en persona.'],
'Ni un papel en el suelo':['Al terminar el recreo, recoge tu basura.','Levanta también algo más que veas tirado.','Tíralo en el bote correcto.'],
'Maestro por un ratito':['Pregunta a un compañero si necesita ayuda con una tarea.','Explícale paso a paso, sin hacérsela.','Deja que lo intente solo y felicítalo.'],
'Nuevo compañero de mesa':['Elige a alguien con quien casi no convives.','Pregúntale si puedes sentarte a comer con él.','Platiquen: pregúntale qué le gusta hacer.'],
'Recreo para todos':['Elige un juego en el que puedan jugar muchos.','Invita a quienes suelen quedarse solos.','Explica las reglas y cuida que todos tengan turno.'],
'Lectura para los pequeños':['Pide permiso a tu maestra para visitar un grupo de Kínder.','Elige un cuento corto y practica leerlo en voz alta.','Léelo con calma y enséñales los dibujos.'],
'Ánimo por mensaje':['Piensa en alguien que esté teniendo un día difícil.','Mándale un mensaje corto y amable.','Si quiere hablar, ofrécete a escucharlo.'],
'Celular fuera de la mesa':['Antes de comer, deja tu celular en otro cuarto.','Pregunta a quien esté contigo cómo le fue.','Platiquen hasta terminar de comer.'],
'Conoce a alguien de otro salón':['Busca a alguien de otro grupo que no conozcas.','Preséntate y dile tu nombre.','Pregúntale cómo va su día y escúchalo.'],
'Aplauso frente al grupo':['Fíjate en algo bueno que hizo un compañero.','Pide un momento en clase o díselo frente al grupo.','Di qué hizo y por qué importa.'],
'Frena un chisme':['Si escuchas un chisme o una burla, no lo repitas.','Di algo como «mejor no hablemos así de él».','Cambia de tema o aléjate.'],
'Incluye a quien se queda fuera':['Fíjate quién se queda sin equipo o come solo.','Invítalo a tu equipo o a tu mesa.','Inclúyelo en la plática, no solo en el lugar.'],
'Cocina algo sencillo':['Elige una receta fácil: huevos, quesadillas o fruta picada.','Pide permiso y prepárala con cuidado.','Sirve a tu familia y limpia la cocina después.'],
'Plática sin pantallas':['Elige a alguien de tu familia.','Guarden los celulares durante 15 minutos.','Pregúntale algo que no sepas de su vida y escucha.'],
'Clase de celular':['Pregunta a un abuelo o a un adulto qué se le dificulta del celular.','Enséñale paso a paso, sin hacerlo tú.','Déjalo practicar hasta que le salga solo.'],
'Sala impecable':['Elige la sala, la cocina o la entrada.','Recoge, limpia y acomoda.','Déjalo como le gustaría a tu familia.'],
'Tarde con alguien mayor':['Con tu familia, piensen en una persona mayor que esté sola.','Avísenle antes y pregúntenle si quiere visita.','Platica con ella y escucha sus historias.'],
'Arregla un conflicto':['Piensa en un problema que tengas con alguien de tu familia.','Busca un momento tranquilo para hablar.','Escucha su lado, di cómo te sentiste y lleguen a un acuerdo.'],
'Misión patio limpio':['Elige el patio, el salón o la cafetería.','Recoge la basura y acomoda lo que esté fuera de lugar.','Invita a un amigo a ayudarte.'],
'Presta tus apuntes':['Pregunta quién faltó a clase.','Ofrécele tus apuntes o mándale una foto.','Explícale lo más importante que vieron.'],
'Oídos para un amigo':['Busca a un amigo y guarda tu celular.','Pregúntale cómo está, de verdad.','Escúchalo 15 minutos sin interrumpir ni dar consejos si no los pide.'],
'Estudien juntos':['Pregunta a un compañero qué materia le cuesta.','Pónganse de acuerdo en un horario.','Estudien juntos y repasen con ejercicios.'],
'Organiza una colecta':['Elige con tu grupo una causa del colegio.','Pide permiso a tu coordinador y fija fecha y lugar.','Invita a otros grupos y entreguen todo juntos.'],
'Ayuda a resolver un conflicto':['Si dos compañeros están peleados, platícalo primero con un maestro.','Con su apoyo, deja que cada uno cuente su lado.','Ayúdales a llegar a un acuerdo, sin tomar partido.'],
'Gracias, profe':['Piensa en algo que aprendiste de un maestro este año.','Al terminar la clase, acércate.','Dile qué aprendiste y en qué te sirvió.'],
'¿Te ayudo a cargar?':['Fíjate en alguien que va cargando cosas o batalla con algo.','Ofrécele ayuda.','Acompáñalo hasta que termine.'],
'Reconoce a alguien en redes':['Elige a un compañero que haya hecho algo valioso.','Pídele permiso para publicarlo.','Publica qué hizo y por qué te inspira.'],
'Gracias a un maestro de antes':['Piensa en un maestro de años anteriores que te marcó.','Escríbele un correo o un mensaje corto.','Dile qué recuerdas de su clase y cómo te ayudó.'],
'Di lo que no está bien':['Si ves una burla o una injusticia, no te quedes callado.','Intervén con calma y respeto.','Si es grave, busca a un adulto de confianza.'],
'¿Cómo estás, en serio?':['Fíjate en alguien que se vea mal.','Pregúntale: «¿cómo estás, de verdad?».','Escucha sin juzgar y, si hace falta, acompáñalo a pedir ayuda.'],
'La cena corre por tu cuenta':['Planea un menú sencillo con lo que haya en casa.','Cocina la cena para tu familia.','Sirve y deja la cocina limpia.'],
'Ayuda con la tarea':['Pregunta a un hermano o primo menor qué tarea tiene.','Explícale sin hacérsela.','Revisen juntos el resultado.'],
'Tecnología para tus abuelos':['Pregúntales qué quieren aprender: videollamadas, fotos o mensajes.','Enséñales paso a paso y escríbeles una guía.','Déjalos practicar solos.'],
'Plan en familia sin pantallas':['Propón una actividad sin pantallas: un juego, una caminata o una comida.','Organiza la fecha, el lugar y lo que se necesita.','Cuida que todos la pasen bien.'],
'Voluntariado de fin de semana':['Busca con tu familia o tus amigos una fundación o un banco de alimentos.','Inscríbanse y confirmen el horario.','Participen medio día y cuenten qué aprendieron.'],
'Un proyecto para tu calle':['Detecten algo que mejorar: limpieza, plantas o un espacio común.','Hablen con los vecinos y pidan permiso a quien corresponda.','Organicen el día y háganlo juntos.'],
'Mentor por un día':['Pregunta en coordinación quién es nuevo.','Acompáñalo en el recreo y preséntale a gente.','Enséñale los lugares importantes del colegio.'],
'Asesor de los más chicos':['Ofrece en coordinación tu ayuda en una materia.','Pónganse de acuerdo en un horario.','Ten paciencia y revisen ejercicios juntos.'],
'Ten Yad: organiza una colecta':['Elige con tu grupo qué juntar: útiles o ropa.','Pide permiso, pon fecha y avisa a todo el colegio.','Clasifiquen lo que junten y entréguenlo a la organización.'],
'Un taller para los pequeños':['Habla con un maestro de Primaria y elijan un tema.','Prepara una actividad de 20 minutos.','Dala con el maestro presente y pídele su opinión.'],
'Lidera un proyecto de servicio':['Elige con tu grupo una necesidad real.','Hagan un plan con metas, tareas y fechas.','Llévenlo a cabo y presenten los resultados al colegio.'],
'Compañía en un asilo':['Inscríbete a la visita que organiza el colegio.','Prepara una actividad: plática, juego o música.','Acompaña a los residentes y escucha sus historias.'],
'Janucá: lleva luz a alguien':['Piensa en alguien que esté solo o pase por un mal momento.','Visítalo, llámale o ayúdale en algo concreto.','Si se puede, enciendan juntos una vela de Janucá.'],
'Janucá: un juguete que vuelve a brillar':['Busca entre tus juguetes uno completo que ya no uses.','Límpialo y revisa que funcione.','Llévalo a la colecta del colegio antes de Janucá.'],
'Tu BiShvat: cuida un árbol':['Elige con tu grupo un árbol o una planta del colegio.','Riégalo, quita la basura alrededor y revisa la tierra.','Pongan un letrero para que otros también lo cuiden.'],
'Purim: Matanot La’Evionim':['Platica con tu familia por qué en Purim se da a quien lo necesita.','Decidan juntos cuánto aportar.','Entréguenlo en la colecta del colegio el día de Purim.'],
'Purim: un Mishloaj Manot inesperado':['Elige a alguien con quien casi no convives.','Prepara un paquete con al menos dos alimentos distintos.','Entrégaselo en Purim con una nota amable.'],
'Pésaj: ayuda a preparar la casa':['Pregunta en casa qué falta para Pésaj.','Ayuda a limpiar tu cuarto y un espacio común.','Ofrece ayuda para preparar la mesa del Séder.'],
'Shavuot: comparte lo que aprendiste':['Piensa en algo valioso que aprendiste este año.','Prepáralo para explicarlo en pocas palabras.','Compártelo con tu familia en Shavuot.'],
'Tu BiShvat: frutas para compartir':['Pregunta en casa qué frutas de temporada puedes llevar.','Lávalas y llévalas en un recipiente.','Compártelas con tu grupo y cuenten de dónde viene cada una.'],
'Pésaj: un lugar más en el Séder':['Piensen en familia quién podría pasar el Séder solo.','Invítenlo con tiempo y pregúntenle si necesita algo.','Recíbelo con cariño y cuéntale lo que se celebra.'],
'Shavuot: lean juntos':['Elige un cuento o un texto que te guste.','Léanlo juntos en voz alta.','Platiquen qué aprendieron y qué les gustó.'],
'Yom HaAtzmaut: decora con tu grupo':['Pregunta a tu maestro cómo pueden decorar.','Ayuda a preparar banderines o dibujos azul y blanco.','Al final, ayuda a recoger el material.'],
'Yom HaAtzmaut: aprende y cuéntalo':['Busca un dato interesante sobre Israel con ayuda de un adulto.','Escríbelo en pocas palabras.','Cuéntaselo a tu familia en la comida.'],
'Día del Maestro: una carta de gracias':['Piensa en un maestro que te haya ayudado mucho.','Escríbele qué aprendiste con él y por qué le agradeces.','Entrégasela en persona el Día del Maestro.'],
'Día del Maestro: sorpresa del salón':['Pónganse de acuerdo en secreto con tu salón.','Preparen algo sencillo: un cartel, una canción o mensajes.','Dénsela juntos el Día del Maestro.'],
'Lag BaOmer: un juego para todos':['Elige un juego al aire libre en el que puedan jugar muchos.','Invita a quienes casi nunca juegan contigo.','Cuida que todos tengan turno y se diviertan.'],
'Lag BaOmer: hagan las paces':['Piensa en alguien con quien te distanciaste.','Búscalo y dile que te gustaría arreglarlo.','Escúchense y acuerden algo juntos.'],
'Rosh Hashaná: un año dulce para alguien':['Prepara un poco de miel o una manzana.','Escribe una nota con buenos deseos para el año nuevo.','Llévasela a un vecino o familiar antes de Rosh Hashaná.'],
'Rosh Hashaná: mi propósito de jésed':['Piensa en una buena acción que te gustaría repetir.','Escríbela y ponla en un lugar donde la veas.','Cuéntale a alguien de tu familia para que te recuerde.'],
'Yom Kipur: pide perdón':['Piensa en alguien a quien lastimaste este año.','Búscalo antes de Yom Kipur.','Pídele perdón con sinceridad y escucha lo que te diga.'],
'Yom Kipur: perdona':['Si alguien te pidió perdón, piénsalo con calma.','Dile con palabras que lo perdonas.','Dale otra oportunidad para empezar de nuevo.'],
'Sucot: invita a la sucá':['Pregunta en casa o en el colegio si pueden invitar a alguien.','Invita a alguien que no tenga sucá.','Recíbelo con cariño y compartan la comida.'],
'Sucot: ayuda a decorar la sucá':['Pregunta cuándo se arma la sucá.','Ayuda a colgar adornos y frutas.','Al terminar, ayuda a dejar todo limpio.'],
'Buenos días para todos':['Al llegar, mira a tu maestra y dile «buenos días».','Saluda también a tres compañeros.','Hazlo con una sonrisa.'],
'Gracias en la cafetería':['Cuando te den tu comida, levanta la mirada.','Di «muchas gracias» con voz clara.','Si puedes, pregúntale cómo está.'],
'Te recojo el lápiz':['Pon atención a tu alrededor en clase.','Si algo se cae, levántalo.','Entrégalo y di «aquí tienes».'],
'Mi lugar es tu lugar':['Fíjate si alguien no encuentra lugar.','Recórrete para hacerle espacio.','Invítalo a sentarse contigo.'],
'Palabras que animan':['Fíjate si alguien se ve triste.','Acércate y pregúntale si está bien.','Dile algo bonito, como «eres buen amigo».'],
'Perdón con abrazo':['Piensa qué pasó y cómo se sintió.','Dile «perdón» mirándolo.','Pregúntale si quiere un abrazo y respeta su respuesta.'],
'Zapatos en su lugar':['Al entrar, quítate los zapatos.','Ponlos juntos en su lugar.','Cuelga o guarda tu mochila.'],
'Ayudo a regar':['Pregunta qué plantas necesitan agua.','Riégalas con cuidado.','Avisa cuando termines.'],
'Pongo la mesa':['Cuenta cuántos van a comer.','Pon un vaso y cubiertos en cada lugar.','Avisa que la mesa está lista.'],
'Un cuento para mi hermano':['Elige un cuento corto.','Léelo o cuéntalo con voces divertidas.','Pregúntale qué parte le gustó.'],
'Caja de juguetes para donar':['Revisa tus juguetes con un adulto.','Separa los que estén completos y ya no uses.','Llévenlos juntos a donar.'],
'Tarjeta para los abuelos':['Dibuja algo que te guste hacer con ellos.','Escribe «te quiero» o una frase bonita.','Entrégala o pide que se la manden.'],
'Mi mesa limpia':['Guarda tus colores y cuadernos.','Tira tus papelitos a la basura.','Acomoda tu silla.'],
'Ayudo a borrar':['Al terminar la clase, acércate a tu maestra.','Pregúntale si le ayudas.','Borra con cuidado de arriba hacia abajo.'],
'Compañero de juego':['En el recreo, busca a alguien con quien casi no juegas.','Pregúntale si quiere jugar.','Dejen que cada uno escoja un juego.'],
'Te explico la tarea':['Pregunta si alguien tiene dudas.','Explica con tus palabras.','Deja que él haga su propio trabajo.'],
'Cartel de buenas acciones':['Pregunta a tu maestra si pueden hacerlo.','Dibujen y escriban ideas para ayudar.','Péguenlo donde todos lo vean.'],
'Guía en el recreo':['Preséntate y dile tu nombre.','Enséñale dónde están los juegos y el baño.','Juega con él en el recreo.']

   case 'notif':return fail(await T('mj_notifs').update({read:p.v.read}).eq('id',p.nid));
   case 'newnotif':return fail(await T('mj_notifs').insert(p.v));
   case 'item':{const d=JSON.parse(JSON.stringify(p.v));if(isNew)return fail(await T('mj_items').insert({kind:p.kind,id:p.id,data:d}));

/* Voz: elige la voz en español más natural del dispositivo y lee frase por frase */
const VOZ={v:null,on:false,q:[]};
function vozScore(v){const n=(v.name+' '+(v.voiceURI||'')).toLowerCase(),l=(v.lang||'').toLowerCase().replace('_','-');if(!l.startsWith('es'))return -1;let s=0;
 if(l==='es-mx')s+=40;else if(l==='es-us'||l==='es-419')s+=32;else if(/es-(co|ar|cl|pe|ve)/.test(l))s+=26;else if(l==='es-es')s+=18;else s+=12;
 if(/natural|neural|online|premium|enhanced|mejorad|wavenet|studio/.test(n))s+=50;
 if(/google/.test(n))s+=22;if(/microsoft/.test(n))s+=14;
 if(/paulina|dalia|jorge|sabina|renata|valeria|monica|mónica|juan|helena|elvira|alvaro|camila|lupe|pedro|marisol|francisca/.test(n))s+=10;
 if(/compact|espeak|eloquence|grandma|grandpa|rocko|shelley|reed|flo|sandy/.test(n))s-=30;
 if(v.localService===false)s+=4;return s}
function vozPick(){try{const L=speechSynthesis.getVoices().map(v=>[vozScore(v),v]).filter(x=>x[0]>=0).sort((a,b)=>b[0]-a[0]);VOZ.v=L.length?L[0][1]:null}catch(e){}}
try{if('speechSynthesis' in window){vozPick();speechSynthesis.addEventListener?speechSynthesis.addEventListener('voiceschanged',vozPick):(speechSynthesis.onvoiceschanged=vozPick)}}catch(e){}
function vozLimpia(t){return String(t).replace(/[«»"“”]/g,'').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}️]/gu,'').replace(/\bmin\b/g,'minutos').replace(/\s+/g,' ').trim()}
function vozFrases(t){const out=[];vozLimpia(t).split(/(?<=[.!?])\s+/).forEach(f=>{f=f.trim();if(!f)return;while(f.length>180){let k=f.lastIndexOf(',',180);if(k<60)k=f.lastIndexOf(' ',180);if(k<1)k=180;out.push(f.slice(0,k+1).trim());f=f.slice(k+1).trim()}if(f)out.push(f)});return out}
function vozBtns(){document.querySelectorAll('[data-act="speak"]').forEach(b=>b.classList.toggle('speaking',VOZ.on))}
function stopSpeak(){VOZ.on=false;VOZ.q=[];try{speechSynthesis.cancel()}catch(e){}vozBtns()}
function speak(t){try{if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined')throw 0;
 if(VOZ.on){stopSpeak();return}
 if(!VOZ.v)vozPick();speechSynthesis.cancel();VOZ.q=vozFrases(t);VOZ.on=true;vozBtns();
 const next=()=>{if(!VOZ.on)return;const f=VOZ.q.shift();if(!f){VOZ.on=false;vozBtns();return}
  const u=new SpeechSynthesisUtterance(f);if(VOZ.v){u.voice=VOZ.v;u.lang=VOZ.v.lang}else u.lang='es-MX';
  const kid=S.mySec==='Kinder'||S.mySec==='Primaria';u.rate=kid?.9:.97;u.pitch=kid?1.08:1.02;u.volume=1;
  u.onend=()=>setTimeout(next,/[.!?]$/.test(f)?260:120);u.onerror=e=>{if(e&&(e.error==='interrupted'||e.error==='canceled'))return;VOZ.on=false;vozBtns()};
  speechSynthesis.speak(u);try{speechSynthesis.resume()}catch(e){}};
 setTimeout(next,60)}catch(e){VOZ.on=false;toast('Este navegador no puede leer en voz alta.')}}

/* ---------- Cuéntalo con tu voz (dictado) ---------- */
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,recBtn=null;
const SRok=()=>!!SRC;
const micLabel=()=>kidLook()?'Dímelo con tu voz':'Dictar con mi voz';
function micBtn(id){return SRok()?`<button type="button" class="btn ghost mic" data-act="dictar" data-id="${id}">${ic('mic',20)} <span>${micLabel()}</span></button>`:''}
function stopDictado(){if(rec){try{rec.stop()}catch(e){}}}
function dictar(btn,id){const ta=document.getElementById(id);if(!ta)return;if(rec){stopDictado();return}
 try{rec=new SRC()}catch(e){toast('Este navegador no puede escuchar. Prueba con Chrome o Safari.');return}
 rec.lang='es-MX';rec.interimResults=true;rec.continuous=true;recBtn=btn;const base=ta.value.trim();let fin='';
 rec.onresult=ev=>{let inter='';for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal)fin+=(fin?' ':'')+r[0].transcript.trim();else inter+=r[0].transcript}
  let t=(fin+(inter?' '+inter:'')).trim();if(t&&!base)t=t[0].toUpperCase()+t.slice(1);ta.value=((base?base+' ':'')+t).slice(0,Number(ta.maxLength)>0?ta.maxLength:500);ta.dispatchEvent(new Event('input',{bubbles:true}))};
 rec.onerror=ev=>{toast(ev.error==='not-allowed'||ev.error==='service-not-allowed'?'Necesitamos permiso para usar el micrófono.':ev.error==='no-speech'?'No te escuché. Toca el micrófono y habla cerca.':'No se pudo escuchar. Inténtalo otra vez.')};
 rec.onend=()=>{rec=null;if(recBtn&&recBtn.isConnected){recBtn.classList.remove('rec');recBtn.innerHTML=ic('mic',20)+' <span>'+micLabel()+'</span>'}recBtn=null;if(typeof saveDraft==='function')saveDraft()};
 try{rec.start()}catch(e){rec=null;toast('No se pudo usar el micrófono.');return}
 btn.classList.add('rec');btn.innerHTML=ic('mic',20)+' <span>Te escucho… toca para terminar</span>'}

const FGLYPH={januca:'🕎',tubishvat:'🌳',purim:'🎭',pesaj:'🫓',shavuot:'📜',atzmaut:'💙',maestro:'✏️',lagbaomer:'🔥',roshhashana:'🍯',yomkipur:'🕊️',sucot:'🌿'};

function stampSVG(f,at,i,s=120){const k=fkey(f),got=!!at,c=got?f.c:'#B9B2C4',id='st'+k+i,rot=((i*37)%17)-8;

 <circle cx="60" cy="60" r="55" fill="${got?`color-mix(in srgb,${c} 9%,#fff)`:'none'}" stroke="${c}" stroke-width="3.5" ${got?'':'stroke-dasharray="6 6"'}/><circle cx="60" cy="60" r="47" fill="none" stroke="${c}" stroke-width="1.6" stroke-dasharray="${got?'2 3':'0'}" opacity=".8"/>
 <text font-family="Manrope,sans-serif" font-size="10.5" font-weight="800" letter-spacing="1.6" fill="${c}"><textPath href="#${id}" startOffset="50%" text-anchor="middle">${esc(f.n.toUpperCase())} · OLAMI ORT</textPath></text>
 <text x="60" y="${got?71:70}" text-anchor="middle" font-size="${got?34:26}" ${got?'':'opacity=".35"'}>${got?FGLYPH[k]||'★':'🔒'}</text>
 ${got?`<text x="60" y="92" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="9.5" font-weight="700" fill="${c}">${new Date(at).toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'2-digit'})}</text>`:''}</svg>`}
function passportHTML(compact){const st=passStamps(),F=uniqFest(),n=F.filter(f=>st[fkey(f)]).length;
 if(compact)return `<section class="card stack" style="gap:10px"><div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:6px"><b>${ic('star',18)} Mi pasaporte de festividades</b><span class="hint">${n} de ${F.length} sellos</span></div><div class="pass-mini">${F.slice(0,6).map((f,i)=>stampSVG(f,st[fkey(f)],i,64)).join('')}</div><button class="btn ghost full" data-act="passport">Ver mi pasaporte</button></section>`;
 return `<div class="printme passdoc"><div class="row" style="gap:12px">${logo(54)}<div><small class="eyebrow">MAAYAN JÉSED · COLEGIO OLAMI ORT</small><h2 style="font-size:28px">Pasaporte de festividades</h2><p class="muted" style="font-weight:700">${esc(S.name)} · ${SEC[S.mySec]||''} ${esc(myGroup?myGroup():'')} · ${n} de ${F.length} sellos</p></div></div>
 <div class="pass-grid">${F.map((f,i)=>`<figure class="pass-cell">${stampSVG(f,st[fkey(f)],i)}<figcaption>${esc(f.n)}<small>${st[fkey(f)]?'¡Sello ganado!':'Haz un reto de '+esc(f.n)+' para ganarlo'}</small></figcaption></figure>`).join('')}</div>
 <p class="hint">Ganas un sello cuando coordinación aprueba un reto de temporada de esa festividad.</p></div>`}
