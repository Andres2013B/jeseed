<style>

/* Layout: una sola pantalla sin pestañas. Arriba: tu gota. Centro: baraja de retos que se desliza. Abajo: el manantial (agua fija) con tu bolsa de retos y el botón "Sumar mi gota". */
:root{
  --bg:#FFF6E5; --surface:#FFFFFF; --ink:#2A1F3D; --muted:#6A5D7E; --line:#F1DFC0;
  --primary:#2B59C3; --primary-deep:#1C3F91; --on-primary:#FFFFFF;
  --sun:#FFC93C; --sun-deep:#C98A00; --coral:#FF6B4A; --sky:#3DA5FF; --mint:#2EC4B6; --lilac:#A77BFF; --leaf:#7CC85A;
  --sun-ink:#2A1F3D; --water:#3DA5FF; --water-deep:#2B59C3; --water-ink:#0E2350; --ok:#1F8A5B; --warn:#B4530F; --bad:#C2352B;
  --font:'Nunito',ui-rounded,'Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17132A; --surface:#221C3B; --ink:#FFF3DE; --muted:#C9BFE0; --line:#3A3160;
  --primary:#7EA2FF; --primary-deep:#4D6FCC; --on-primary:#10142E;
  --water:#2F7FD0; --water-deep:#1E4FA0; --water-ink:#FFF3DE; --ok:#5FD39A; --warn:#FFB26B; --bad:#FF8A7A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17132A; --surface:#221C3B; --ink:#FFF3DE; --muted:#C9BFE0; --line:#3A3160;
  --primary:#7EA2FF; --primary-deep:#4D6FCC; --on-primary:#10142E;
  --water:#2F7FD0; --water-deep:#1E4FA0; --water-ink:#FFF3DE; --ok:#5FD39A; --warn:#FFB26B; --bad:#FF8A7A; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.12;font-weight:900}
p{margin:0}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 390px;display:flex;flex-direction:column;gap:14px}
/* Encabezado: tu gota */
.me{display:flex;align-items:center;gap:10px;background:none;border:none;padding:0;cursor:pointer;text-align:left;width:100%}
.me .hi{flex:1;min-width:0}
.me .hi b{display:block;font-size:20px;font-weight:900}
.me .hi span{font-size:13px;font-weight:800;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-weight:900;font-size:15px}
.stat2{flex-direction:row;flex-wrap:wrap;justify-content:center;line-height:1.05;padding:5px 10px}
.stat2 small{flex-basis:100%;text-align:center;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.3px}
.role{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-size:12px}
.fest{display:flex;align-items:center;gap:12px;width:100%;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:10px 14px;cursor:pointer;text-align:left;font-weight:800}
.fest .n{flex:none;min-width:48px;height:48px;border-radius:14px;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;font-size:20px;font-weight:900;line-height:1;text-align:center;padding:4px}
.fest .n small{display:block;font-size:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px;cursor:pointer;min-height:40px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* Baraja */
.deck{position:relative;height:470px;touch-action:pan-y}
.dcard{position:absolute;inset:0;overflow:hidden;border-radius:30px;padding:22px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--c) 30%,var(--surface));border:3px solid var(--ink);box-shadow:0 7px 0 var(--ink);user-select:none;transition:transform .35s cubic-bezier(.2,.9,.3,1),opacity .3s;will-change:transform}
.dcard.b1{transform:translateY(16px) scale(.94);z-index:1}
.dcard.b2{transform:translateY(32px) scale(.88);z-index:0;opacity:.8}
.dcard.front{z-index:3;cursor:grab;transform-origin:50% 115%}
.dcard.front.dragging{transition:none;cursor:grabbing}
.dcard .ico{width:52px;height:52px;border-radius:20px;background:var(--surface);border:3px solid var(--ink);display:grid;place-items:center}
.dcard h2{font-size:28px;letter-spacing:-.4px}
.dcard p{font-weight:700;font-size:16px}
.dcard .meta{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:2px solid var(--ink);border-radius:999px;padding:5px 11px;font-weight:900;font-size:13px}
.ribbon{position:absolute;right:18px;top:18px;background:var(--ink);color:var(--bg);font-weight:900;font-size:12px;letter-spacing:1.2px;border-radius:999px;padding:6px 12px}
.stamp{position:absolute;top:26px;font-weight:900;font-size:24px;letter-spacing:1px;border:4px solid currentColor;border-radius:14px;padding:4px 12px;opacity:0;pointer-events:none;background:var(--surface)}
.stamp.yes{left:20px;color:var(--ok);transform:rotate(-12deg)}
.stamp.no{right:20px;color:var(--bad);transform:rotate(12deg)}
.deck-btns{display:flex;justify-content:center;align-items:flex-start;gap:18px}
.rb{display:grid;grid-template-rows:100px auto;justify-items:center;align-items:center;row-gap:2px;min-width:80px}.rb>span{font-size:13px;font-weight:900;color:var(--ink,inherit);text-align:center;line-height:1.1}
.dcard.front.swdemo{animation:swdemo 2.4s ease-in-out .4s 1 !important}
@keyframes swdemo{0%,100%{translate:0;rotate:0deg}25%{translate:60px 0;rotate:6deg}55%{translate:-60px 0;rotate:-6deg}80%{translate:0;rotate:0deg}}
.swhand{position:absolute;left:50%;bottom:22%;font-size:42px;transform:translateX(-50%);pointer-events:none;animation:swhand 2.4s ease-in-out .4s 1;filter:drop-shadow(0 4px 6px #0003);z-index:5}
@keyframes swhand{0%,100%{transform:translateX(-50%)}25%{transform:translateX(10%)}55%{transform:translateX(-110%)}80%{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.swdemo,.swhand{animation:none}}
.round{width:68px;height:68px;border-radius:34px;border:3px solid var(--ink);background:var(--surface);display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.round:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.round.yes{width:84px;height:84px;border-radius:42px;background:var(--primary);border-color:var(--primary-deep);box-shadow:0 6px 0 var(--primary-deep)}
.round.info{width:52px;height:52px;border-radius:26px}
.hint{font-size:13px;color:var(--muted);font-weight:700}
.center{text-align:center}
/* Manantial fijo abajo */
.spring{position:fixed;left:0;right:0;bottom:0;z-index:6;pointer-events:none}
.spring .water{position:absolute;left:0;right:0;bottom:0;height:var(--wh,250px);transition:height 1.4s cubic-bezier(.2,.8,.2,1)}
.spring .water .w{position:absolute;left:0;width:200%;height:26px;animation:wave 5s linear infinite}
.spring .water .w.w1{top:-22px}
.spring .water .w.w2{top:-16px;animation-duration:8s;opacity:.6}
.spring .water .body{position:absolute;inset:2px 0 0;background:var(--water)}
.spring .bub{position:absolute;bottom:0;border-radius:50%;background:rgba(255,255,255,.35);animation:bub 7s ease-in infinite}
.spring .inner{position:relative;max-width:480px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;pointer-events:auto}
.wl{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--water-ink)}
.wl button{background:none;border:none;color:var(--water-ink);font-weight:900;cursor:pointer;padding:6px 0;min-height:40px;text-align:left}
.story{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:800!important;opacity:.95}
.tray{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;min-height:52px;align-items:center;justify-content:safe center}
.tdrop{flex:none;display:flex;align-items:center;gap:8px;background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:18px;padding:8px 12px;font-weight:800;font-size:14px;cursor:pointer;max-width:220px;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both;min-height:48px}
.tdrop span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdrop.review{opacity:.75;border-style:dashed}
.tdrop.fix{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn) inset}
.tray .empty{color:var(--water-ink);font-weight:800;font-size:14px;opacity:.95}
.big{width:100%;min-height:58px;border:3px solid var(--ink);border-radius:20px;background:var(--sun);color:var(--sun-ink);font-weight:900;font-size:19px;cursor:pointer;box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .08s,box-shadow .08s}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
/* Botones y hojas */

'Maestro por un ratito':['Pregunta a un compañero si necesita ayuda con una tarea.','Explícale paso a paso, sin hacérsela.','Deja que lo intente solo y felicítalo.'],
'Nuevo compañero de mesa':['Elige a alguien con quien casi no convives.','Pregúntale si puedes sentarte a comer con él.','Platiquen: pregúntale qué le gusta hacer.'],
'Recreo para todos':['Elige un juego en el que puedan jugar muchos.','Invita a quienes suelen quedarse solos.','Explica las reglas y cuida que todos tengan turno.'],
'Lectura para los pequeños':['Pide permiso a tu maestra para visitar un grupo de Kínder.','Elige un cuento corto y practica leerlo en voz alta.','Léelo con calma y enséñales los dibujos.'],
'Ánimo por mensaje':['Piensa en alguien que esté teniendo un día difícil.','Mándale un mensaje corto y amable.','Si quiere hablar, ofrécete a escucharlo.'],
'Celular fuera de la mesa':['Antes de comer, deja tu celular en otro cuarto.','Pregunta a quien esté contigo cómo le fue.','Platiquen hasta terminar de comer.'],
'Conoce a alguien de otro salón':['Busca a alguien de otro grupo que no conozcas.','Preséntate y dile tu nombre.','Pregúntale cómo va su día y escúchalo.'],
'Aplauso frente al grupo':['Fíjate en algo bueno que hizo un compañero.','Pide un momento en clase o díselo frente al grupo.','Di qué hizo y por qué importa.'],
'Frena un chisme':['Si escuchas un chisme o una burla, no lo repitas.','Di algo como «mejor no hablemos así de él».','Cambia de tema o aléjate.'],
'Incluye a quien se queda fuera':['Fíjate quién se queda sin equipo o come solo.','Invítalo a tu equipo o a tu mesa.','Inclúyelo en la plática, no solo en el lugar.'],
'Cocina algo sencillo':['Elige una receta fácil: huevos, quesadillas o fruta picada.','Pide permiso y prepárala con cuidado.','Sirve a tu familia y limpia la cocina después.'],
'Plática sin pantallas':['Elige a alguien de tu familia.','Guarden los celulares durante 15 minutos.','Pregúntale algo que no sepas de su vida y escucha.'],
'Clase de celular':['Pregunta a un abuelo o a un adulto qué se le dificulta del celular.','Enséñale paso a paso, sin hacerlo tú.','Déjalo practicar hasta que le salga solo.'],
'Sala impecable':['Elige la sala, la cocina o la entrada.','Recoge, limpia y acomoda.','Déjalo como le gustaría a tu familia.'],
'Tarde con alguien mayor':['Con tu familia, piensen en una persona mayor que esté sola.','Avísenle antes y pregúntenle si quiere visita.','Platica con ella y escucha sus historias.'],
'Arregla un conflicto':['Piensa en un problema que tengas con alguien de tu familia.','Busca un momento tranquilo para hablar.','Escucha su lado, di cómo te sentiste y lleguen a un acuerdo.'],
'Misión patio limpio':['Elige el patio, el salón o la cafetería.','Recoge la basura y acomoda lo que esté fuera de lugar.','Invita a un amigo a ayudarte.'],
'Presta tus apuntes':['Pregunta quién faltó a clase.','Ofrécele tus apuntes o mándale una foto.','Explícale lo más importante que vieron.'],
'Oídos para un amigo':['Busca a un amigo y guarda tu celular.','Pregúntale cómo está, de verdad.','Escúchalo 15 minutos sin interrumpir ni dar consejos si no los pide.'],
'Estudien juntos':['Pregunta a un compañero qué materia le cuesta.','Pónganse de acuerdo en un horario.','Estudien juntos y repasen con ejercicios.'],
'Organiza una colecta':['Elige con tu grupo una causa del colegio.','Pide permiso a tu coordinador y fija fecha y lugar.','Invita a otros grupos y entreguen todo juntos.'],
'Ayuda a resolver un conflicto':['Si dos compañeros están peleados, platícalo primero con un maestro.','Con su apoyo, deja que cada uno cuente su lado.','Ayúdales a llegar a un acuerdo, sin tomar partido.'],
'Gracias, profe':['Piensa en algo que aprendiste de un maestro este año.','Al terminar la clase, acércate.','Dile qué aprendiste y en qué te sirvió.'],
'¿Te ayudo a cargar?':['Fíjate en alguien que va cargando cosas o batalla con algo.','Ofrécele ayuda.','Acompáñalo hasta que termine.'],
'Reconoce a alguien en redes':['Elige a un compañero que haya hecho algo valioso.','Pídele permiso para publicarlo.','Publica qué hizo y por qué te inspira.'],
'Gracias a un maestro de antes':['Piensa en un maestro de años anteriores que te marcó.','Escríbele un correo o un mensaje corto.','Dile qué recuerdas de su clase y cómo te ayudó.'],
'Di lo que no está bien':['Si ves una burla o una injusticia, no te quedes callado.','Intervén con calma y respeto.','Si es grave, busca a un adulto de confianza.'],
'¿Cómo estás, en serio?':['Fíjate en alguien que se vea mal.','Pregúntale: «¿cómo estás, de verdad?».','Escucha sin juzgar y, si hace falta, acompáñalo a pedir ayuda.'],
'La cena corre por tu cuenta':['Planea un menú sencillo con lo que haya en casa.','Cocina la cena para tu familia.','Sirve y deja la cocina limpia.'],
'Ayuda con la tarea':['Pregunta a un hermano o primo menor qué tarea tiene.','Explícale sin hacérsela.','Revisen juntos el resultado.'],
'Tecnología para tus abuelos':['Pregúntales qué quieren aprender: videollamadas, fotos o mensajes.','Enséñales paso a paso y escríbeles una guía.','Déjalos practicar solos.'],
'Plan en familia sin pantallas':['Propón una actividad sin pantallas: un juego, una caminata o una comida.','Organiza la fecha, el lugar y lo que se necesita.','Cuida que todos la pasen bien.'],
'Voluntariado de fin de semana':['Busca con tu familia o tus amigos una fundación o un banco de alimentos.','Inscríbanse y confirmen el horario.','Participen medio día y cuenten qué aprendieron.'],
'Un proyecto para tu calle':['Detecten algo que mejorar: limpieza, plantas o un espacio común.','Hablen con los vecinos y pidan permiso a quien corresponda.','Organicen el día y háganlo juntos.'],
'Mentor por un día':['Pregunta en coordinación quién es nuevo.','Acompáñalo en el recreo y preséntale a gente.','Enséñale los lugares importantes del colegio.'],
'Asesor de los más chicos':['Ofrece en coordinación tu ayuda en una materia.','Pónganse de acuerdo en un horario.','Ten paciencia y revisen ejercicios juntos.'],
'Ten Yad: organiza una colecta':['Elige con tu grupo qué juntar: útiles o ropa.','Pide permiso, pon fecha y avisa a todo el colegio.','Clasifiquen lo que junten y entréguenlo a la organización.'],
'Un taller para los pequeños':['Habla con un maestro de Primaria y elijan un tema.','Prepara una actividad de 20 minutos.','Dala con el maestro presente y pídele su opinión.'],
'Lidera un proyecto de servicio':['Elige con tu grupo una necesidad real.','Hagan un plan con metas, tareas y fechas.','Llévenlo a cabo y presenten los resultados al colegio.'],
'Compañía en un asilo':['Inscríbete a la visita que organiza el colegio.','Prepara una actividad: plática, juego o música.','Acompaña a los residentes y escucha sus historias.'],
'Janucá: lleva luz a alguien':['Piensa en alguien que esté solo o pase por un mal momento.','Visítalo, llámale o ayúdale en algo concreto.','Si se puede, enciendan juntos una vela de Janucá.'],
'Janucá: un juguete que vuelve a brillar':['Busca entre tus juguetes uno completo que ya no uses.','Límpialo y revisa que funcione.','Llévalo a la colecta del colegio antes de Janucá.'],
'Tu BiShvat: cuida un árbol':['Elige con tu grupo un árbol o una planta del colegio.','Riégalo, quita la basura alrededor y revisa la tierra.','Pongan un letrero para que otros también lo cuiden.'],
'Purim: Matanot La’Evionim':['Platica con tu familia por qué en Purim se da a quien lo necesita.','Decidan juntos cuánto aportar.','Entréguenlo en la colecta del colegio el día de Purim.'],
'Purim: un Mishloaj Manot inesperado':['Elige a alguien con quien casi no convives.','Prepara un paquete con al menos dos alimentos distintos.','Entrégaselo en Purim con una nota amable.'],
'Pésaj: ayuda a preparar la casa':['Pregunta en casa qué falta para Pésaj.','Ayuda a limpiar tu cuarto y un espacio común.','Ofrece ayuda para preparar la mesa del Séder.'],
'Shavuot: comparte lo que aprendiste':['Piensa en algo valioso que aprendiste este año.','Prepáralo para explicarlo en pocas palabras.','Compártelo con tu familia en Shavuot.'],
'Tu BiShvat: frutas para compartir':['Pregunta en casa qué frutas de temporada puedes llevar.','Lávalas y llévalas en un recipiente.','Compártelas con tu grupo y cuenten de dónde viene cada una.'],
'Pésaj: un lugar más en el Séder':['Piensen en familia quién podría pasar el Séder solo.','Invítenlo con tiempo y pregúntenle si necesita algo.','Recíbelo con cariño y cuéntale lo que se celebra.'],
'Shavuot: lean juntos':['Elige un cuento o un texto que te guste.','Léanlo juntos en voz alta.','Platiquen qué aprendieron y qué les gustó.'],
'Yom HaAtzmaut: decora con tu grupo':['Pregunta a tu maestro cómo pueden decorar.','Ayuda a preparar banderines o dibujos azul y blanco.','Al final, ayuda a recoger el material.'],
'Yom HaAtzmaut: aprende y cuéntalo':['Busca un dato interesante sobre Israel con ayuda de un adulto.','Escríbelo en pocas palabras.','Cuéntaselo a tu familia en la comida.'],
'Día del Maestro: una carta de gracias':['Piensa en un maestro que te haya ayudado mucho.','Escríbele qué aprendiste con él y por qué le agradeces.','Entrégasela en persona el Día del Maestro.'],
'Día del Maestro: sorpresa del salón':['Pónganse de acuerdo en secreto con tu salón.','Preparen algo sencillo: un cartel, una canción o mensajes.','Dénsela juntos el Día del Maestro.'],
'Lag BaOmer: un juego para todos':['Elige un juego al aire libre en el que puedan jugar muchos.','Invita a quienes casi nunca juegan contigo.','Cuida que todos tengan turno y se diviertan.'],
'Lag BaOmer: hagan las paces':['Piensa en alguien con quien te distanciaste.','Búscalo y dile que te gustaría arreglarlo.','Escúchense y acuerden algo juntos.'],

'Rosh Hashaná: mi propósito de jésed':['Piensa en una buena acción que te gustaría repetir.','Escríbela y ponla en un lugar donde la veas.','Cuéntale a alguien de tu familia para que te recuerde.'],
'Yom Kipur: pide perdón':['Piensa en alguien a quien lastimaste este año.','Búscalo antes de Yom Kipur.','Pídele perdón con sinceridad y escucha lo que te diga.'],
'Yom Kipur: perdona':['Si alguien te pidió perdón, piénsalo con calma.','Dile con palabras que lo perdonas.','Dale otra oportunidad para empezar de nuevo.'],
'Sucot: invita a la sucá':['Pregunta en casa o en el colegio si pueden invitar a alguien.','Invita a alguien que no tenga sucá.','Recíbelo con cariño y compartan la comida.'],
'Sucot: ayuda a decorar la sucá':['Pregunta cuándo se arma la sucá.','Ayuda a colgar adornos y frutas.','Al terminar, ayuda a dejar todo limpio.'],
'Buenos días para todos':['Al llegar, mira a tu maestra y dile «buenos días».','Saluda también a tres compañeros.','Hazlo con una sonrisa.'],
'Gracias en la cafetería':['Cuando te den tu comida, levanta la mirada.','Di «muchas gracias» con voz clara.','Si puedes, pregúntale cómo está.'],
'Te recojo el lápiz':['Pon atención a tu alrededor en clase.','Si algo se cae, levántalo.','Entrégalo y di «aquí tienes».'],
'Mi lugar es tu lugar':['Fíjate si alguien no encuentra lugar.','Recórrete para hacerle espacio.','Invítalo a sentarse contigo.'],
'Palabras que animan':['Fíjate si alguien se ve triste.','Acércate y pregúntale si está bien.','Dile algo bonito, como «eres buen amigo».'],
'Perdón con abrazo':['Piensa qué pasó y cómo se sintió.','Dile «perdón» mirándolo.','Pregúntale si quiere un abrazo y respeta su respuesta.'],
'Zapatos en su lugar':['Al entrar, quítate los zapatos.','Ponlos juntos en su lugar.','Cuelga o guarda tu mochila.'],
'Ayudo a regar':['Pregunta qué plantas necesitan agua.','Riégalas con cuidado.','Avisa cuando termines.'],
'Pongo la mesa':['Cuenta cuántos van a comer.','Pon un vaso y cubiertos en cada lugar.','Avisa que la mesa está lista.'],
'Un cuento para mi hermano':['Elige un cuento corto.','Léelo o cuéntalo con voces divertidas.','Pregúntale qué parte le gustó.'],
'Caja de juguetes para donar':['Revisa tus juguetes con un adulto.','Separa los que estén completos y ya no uses.','Llévenlos juntos a donar.'],
'Tarjeta para los abuelos':['Dibuja algo que te guste hacer con ellos.','Escribe «te quiero» o una frase bonita.','Entrégala o pide que se la manden.'],
'Mi mesa limpia':['Guarda tus colores y cuadernos.','Tira tus papelitos a la basura.','Acomoda tu silla.'],
'Ayudo a borrar':['Al terminar la clase, acércate a tu maestra.','Pregúntale si le ayudas.','Borra con cuidado de arriba hacia abajo.'],
'Compañero de juego':['En el recreo, busca a alguien con quien casi no juegas.','Pregúntale si quiere jugar.','Dejen que cada uno escoja un juego.'],
'Te explico la tarea':['Pregunta si alguien tiene dudas.','Explica con tus palabras.','Deja que él haga su propio trabajo.'],
'Cartel de buenas acciones':['Pregunta a tu maestra si pueden hacerlo.','Dibujen y escriban ideas para ayudar.','Péguenlo donde todos lo vean.'],
'Guía en el recreo':['Preséntate y dile tu nombre.','Enséñale dónde están los juegos y el baño.','Juega con él en el recreo.']

   case 'notif':return fail(await T('mj_notifs').update({read:p.v.read}).eq('id',p.nid));
   case 'newnotif':return fail(await T('mj_notifs').insert(p.v));

 async function flush(){if(!sb||!S.logged)return;const P=pieces(),jobs=[];
  for(const [k,p] of Object.entries(P)){const j=JSON.stringify(p.v);if(snap[k]===j)continue;
   if(p.t==='set'&&!isAdmin())continue;
   if(p.t==='acc'&&!isAdmin())continue;
   if(p.t==='inv'&&!isAdmin())continue;
   jobs.push([k,p,!(k in snap),j])}
  const gone=Object.keys(snap).filter(k=>!(k in P)&&(k.startsWith('item:')||k.startsWith('inv:')));
  let err=null;
  for(const [k,p,isNew,j] of jobs){try{await write(k,p,isNew);if(p.t==='newnotif')delete snap[k];else snap[k]=j}catch(e){err=e;console.error(k,e)}}
  for(const k of gone){try{await remove(k);delete snap[k]}catch(e){err=e;console.error(k,e)}}
  if(jobs.some(j=>j[1].t==='newnotif'))await reload(true);
  if(err){toast(msg(err));await reload(true)}}

function weekChart(){const now=Date.now(),W=7*86400000,v=[5,4,3,2,1,0].map(i=>approved().filter(s=>s.at>now-(i+1)*W&&s.at<=now-i*W).reduce((a,s)=>a+s.pts,0)),max=Math.max(20,...v);
 return `<div class="cols" role="img" aria-label="Tus gotas en las últimas 6 semanas: ${v.join(', ')}">${v.map((x,i)=>`<div class="${i===5?'now':''}"><b>${x}</b><i style="height:${Math.max(3,x/max*78)}%"></i><span>${i===5?'Esta':'Hace '+(5-i)}</span></div>`).join('')}</div>`}
const GRPS={Kinder:['K1','K2','K3'],Primaria:['1.º A','2.º B','3.º B','4.º B','5.º A','6.º A'],Secundaria:['1.º A','1.º B','2.º C','3.º A'],Prepa:['4.º A','5.º A','6.º B']};
function groupChart(){const names=GRPS[S.mySec],mine=myGroup(),m0=monthStart();const rows=names.map(n=>[n,studsAll().filter(a=>a.sec===S.mySec&&a.grp===n).reduce((x,a)=>x+(S.studs[a.id]?S.studs[a.id].subs:[]).filter(s=>s.status==='approved'&&(s.at||0)>=m0).reduce((y,s)=>y+s.pts,0),0),n===mine]).sort((a,b)=>b[1]-a[1]),max=Math.max(1,rows[0][1]);
 return rows.map(r=>`<div class="hbar ${r[2]?'me':''}"><span>${r[0]}${r[2]?' · tú':''}</span><span class="tr"><span style="width:${r[1]/max*100}%"></span></span><span style="text-align:right;font-variant-numeric:tabular-nums">${r[1]}</span></div>`).join('')}

function scrub(t,names){let o=String(t).replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi,'X').replace(/\+?\d[\d\s()-]{7,}\d/g,'X');names.forEach(n=>{n=n.trim();if(n.length>1)o=o.replace(new RegExp('(^|[^\\p{L}])'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![\\p{L}])','giu'),'$1X')});return o}

 if(!ok&&!com){toast('Escribe qué debe corregir el alumno.');c&&c.focus();return}
 const before=badgeCount(),rr=s.rid&&reto(s.rid),lb=rr&&rr.trk?lvlOf(rr.trk):0;s.status=ok?'approved':'rejected';s.comment=com;if(!(ok&&s.show))s.photo=null;const p=document.getElementById('r-pts');if(ok&&p)s.pts=Math.max(0,parseInt(p.value,10)||0);notify(ok?`¡Aprobaron «${s.title}»! +${s.pts} ${(s.pts)===1?'gota':'gotas'}.`:`Te pidieron corregir «${s.title}»: ${com}`,s.owner);
 S.log.push({title:s.title,status:s.status,comment:com,by:'Coordinación',at:Date.now()});save();closeSheet();renderAll(true);
 if(ok){dropFx(s.pts);const la=rr&&rr.trk?lvlOf(rr.trk):0;if(la>lb)setTimeout(()=>{confetti();toast(`¡Subió al nivel ${LV[la]} en «${TRK[rr.trk]}»! Ahora esos retos valen +${LVP[la]} ${(LVP[la])===1?'gota':'gotas'}.`)},900);else if(badgeCount()>before)setTimeout(()=>{confetti();toast('¡El alumno desbloqueó una insignia!')},900);else toast('Aprobada: la gota cayó al manantial.')}else toast('Regresó al alumno con tu comentario.')}

const ROLES=['alumno','familia','maestro','admin'];
const ROLE_N={alumno:'Alumno',familia:'Familia',maestro:'Maestro',admin:'Coordinación'};
const ROLE_S={alumno:'Alumno',familia:'Familia',maestro:'Maestro',admin:'Coord.'};

const ROLE_D={alumno:'Retos, gotas y tu bolsa',familia:'Progreso de tu hijo, confirmaciones y permisos',maestro:'Confirma y anima a tu salón',admin:'Revisión, retos y panel de Dirección'};
let ptab=null;
const isStaff=()=>S.role==='maestro'||S.role==='admin';
const isK=()=>S.role==='alumno'&&(S.kinder||(S.mySec==='Kinder'&&S.settings.kinderAuto));
const myBand=()=>bandOfGrp(S.mySec,myGroup());
const myAge=()=>AGES[myBand()||S.mySec];
const fitsMe=r=>r.sec===S.mySec&&(!r.band||r.band===myBand())&&(!r.salon||r.salon===myGroup());
const myGroup=()=>{const g=GRPS[S.mySec];return g.includes(S.grp)?S.grp:g[Math.min(3,g.length-1)]};
function needVal(s){const r=s.rid&&reto(s.rid);return r&&r.trk==='colegio'?'maestro':r&&r.trk==='casa'?'familia':null}
function valLabel(s){const n=needVal(s);if(!n)return '';const who=n==='maestro'?'su maestro':'su familia';if(!s.val)return `Falta que lo confirme ${who}`;return s.val.ok?`Confirmado por ${who}`:`${n==='maestro'?'Su maestro':'Su familia'}: no le consta`}
function notify(t,sid){const id=sid||curSid();if(!id||!S.studs[id])return;const L=id===curSid()&&S.notifs?S.notifs:S.studs[id].notifs;L.push({t,at:Date.now(),read:false});if(L.length>40)L.shift()}
const notifyMany=(t,f)=>studsAll().filter(f).forEach(a=>notify(t,a.id));
const OKW=['Janucá','Purim','Pésaj','Shavuot','Sucot','Kipur','Hashaná','Olami','México','Israel','Kínder','Primaria','Secundaria','Prepa','Ten','Yad','Mishloaj','Manot','Séder','Shabat','Hoy','Ayer'];
function aiCheck(s){const f=[],t=String(s.text||'').trim(),r=s.rid&&reto(s.rid);
 if(t.length<40)f.push('Relato muy corto: conviene pedir más detalle.');
 if(/^(ayud[ée] a alguien|hice algo bueno|fui amable|ayud[ée])\.?$/i.test(t))f.push('Relato genérico.');
 const caps=[...new Set((t.match(/[^.!?¿¡\s]\s+[A-ZÁÉÍÓÚÑ][a-záéíóúñ]{2,}/g)||[]).map(x=>x.trim().split(/\s+/).pop()))].filter(w=>!OKW.includes(w));
 if(caps.length)f.push('Posibles nombres: '+caps.slice(0,3).join(', ')+'.');
 if(S.subs.some(o=>o.id!==s.id&&String(o.text).trim().toLowerCase()===t.toLowerCase()))f.push('Texto repetido de otra acción.');
 if(S.subs.filter(o=>new Date(o.at).toDateString()===new Date(s.at).toDateString()).length>5)f.push('Muchas acciones el mismo día.');
 const n=needVal(s);if(n&&s.val&&!s.val.ok)f.push(`${n==='maestro'?'El maestro':'La familia'} indicó que no le consta.`);
 return{f,sug:r?r.pts:(t.length>120?20:10)}}
function aiBox(s){const a=aiCheck(s);return `<div class="ai"><b>${ic('spark',16)} Asistente de revisión</b>${a.f.length?a.f.map(x=>`<span>• ${esc(x)}</span>`).join(''):'<span>Sin alertas: relato concreto y sin datos privados.</span>'}<span>Gotas sugeridas: <b>${a.sug}</b></span></div>`}
function speak(t){try{if(!('speechSynthesis' in window))throw 0;const u=new SpeechSynthesisUtterance(t);u.lang='es-MX';u.rate=.92;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){toast('Este navegador no puede leer en voz alta.')}}
const tvFeed=()=>{const L=feed(),f=L.filter(p=>S.featured.includes(p.id));return f.length?[...f,...L.filter(p=>!S.featured.includes(p.id))]:L};

function colsChart(v,lb){const max=Math.max(1,...v);return `<div class="cols" style="grid-template-columns:repeat(${v.length},minmax(0,1fr))" role="img" aria-label="Valores: ${v.join(', ')}">${v.map((x,i)=>`<div class="${i===v.length-1?'now':''}"><b>${x}</b><i style="height:${Math.max(3,x/max*78)}%"></i><span>${lb[i]}</span></div>`).join('')}</div>`}

 const act=a=>(S.studs[a.id]?S.studs[a.id].subs:[]).some(s=>s.status==='approved'&&(s.at||0)>=m0),pct=L=>L.length?Math.round(L.filter(act).length/L.length*100):0;

 return `<div class="kpis"><div class="kpi"><b>${pct(ST2)}%</b><span>de alumnos participó este mes</span></div><div class="kpi"><b>${nf(all.filter(s=>(s.at||0)>=c0).length)}</b><span>acciones aprobadas en el ciclo</span></div><div class="kpi"><b>${nf(f.total)}</b><span>gotas en el manantial</span></div><div class="kpi"><b>${nf(hrs)}</b><span>horas de servicio social</span></div></div>

 if(ptab==='registro')return `<section class="card">${S.log.length?S.log.slice().reverse().map(l=>`<div class="hist"><p><b>${esc(l.title)}</b><br><span class="hint">${esc(l.comment||'Sin comentario')}${l.by?' · '+esc(l.by):''}</span></p>${l.by==='Maestro'||l.by==='Familia'?`<span class="status ${l.status==='approved'?'approved':'pending'}">${l.status==='approved'?'Confirmó':'No le consta'}</span>`:statusPill(l.status)}</div>`).join(''):'<p class="hint">Aquí queda cada aprobación, regreso y confirmación.</p>'}</section>`;return ''}
function validate(id,ok){const s=S.subs.find(x=>x.id===id);if(!s)return;s.val={by:S.role,ok,at:Date.now()};const who=S.role==='maestro'?'Tu maestro':'Tu familia';
 S.log.push({title:s.title,status:ok?'approved':'rejected',comment:ok?'Confirmó que lo vio':'No le consta',by:S.role==='maestro'?'Maestro':'Familia',at:Date.now()});
 if(ok)notify(`${who} confirmó «${s.title}». Ahora lo revisa coordinación.`,s.owner);save();renderAll(true);toast(ok?'Confirmado. Ahora lo revisa coordinación.':'Anotado. Coordinación lo tomará en cuenta.')}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=t.dataset.id,n=Number(id);
 if(a==='bgclose'&&e.target!==t)return;
 switch(a){
 case 'yes':swipe(1);break;
 case 'no':swipe(-1);break;
 case 'shuffle':skipped=[];filter='parati';const q=pool();skipped=q.slice(0,1+Math.floor(Math.random()*Math.max(1,q.length-1))).map(r=>r.id);renderAll(true);toast('Retos revueltos.');break;
 case 'adjust':{const q=queue();if(q.length)adjustSheet(q[0].id);break}
 case 'filter':filter=id;skipped=[];renderTop();renderDeck(true);break;
 case 'me':meSheet();break;
 case 'cal':calSheet();break;
 case 'spring':springSheet();break;
 case 'top':topSheet();break;
 case 'copycode':{const c=id;try{navigator.clipboard.writeText(c).then(()=>toast('Clave copiada: '+c),()=>toast('Clave: '+c))}catch(x){toast('Clave: '+c)}break}
 case 'delcode':S.invites=S.invites.filter(i=>i.code!==id);save();renderAll();toast('Clave anulada.');break;
 case 'rsec':catSec=id;renderAll(true);break;
 case 'redit':retoForm(id);break;
 case 'rdel':{const r=reto(n);if(r)sheet(`<h2 style="font-size:24px">¿Borrar este reto?</h2><p class="muted" style="font-weight:700">«${esc(r.t)}» desaparecerá de la baraja. Las acciones que ya se hicieron con él se conservan.</p><div class="row"><button class="btn ghost" style="flex:1" data-act="close">Cancelar</button><button class="btn" style="flex:1;background:var(--bad);box-shadow:none" data-act="rdelok" data-id="${r.id}">${ic('trash',18,'var(--on-primary)')} Borrar</button></div>`);break}
 case 'rdelok':S.cat=S.cat.filter(x=>x.id!==n);S.custom=S.custom.filter(x=>x.id!==n);S.log.push({title:'Reto borrado del catálogo',status:'rejected',comment:'',by:'Coordinación',at:Date.now()});save();closeSheet();renderAll();toast('Reto borrado.');break;
 case 'haveacc':haveSheet();break;
 case 'toproj':document.getElementById('proyecto').scrollIntoView({behavior:'smooth',block:'start'});break;
 case 'toreg':document.getElementById('registro').scrollIntoView({behavior:'smooth',block:'start'});break;
 case 'regrole':renderLogin.r=id;renderLogin();document.getElementById('registro').scrollIntoView({block:'start'});break;
 
 case 'proponer':sheet(`<div class="eyebrow">Tu idea cuenta</div><h2 style="font-size:26px">Propón un reto</h2><form class="stack" id="fprop"><label class="f" for="pp-t">Título<input class="in" id="pp-t" required minlength="5" maxlength="60"></label><label class="f" for="pp-d">¿Qué hay que hacer y a quién ayuda?<textarea class="in" id="pp-d" required minlength="15" maxlength="300"></textarea></label><label class="f" for="pp-k">Camino<select class="in" id="pp-k">${Object.keys(TRK).map(k=>`<option value="${k}">${TRK[k]}</option>`).join('')}</select></label><button class="btn full">Enviar a coordinación</button></form><p class="hint">Si coordinación la autoriza, tu reto aparecerá en la baraja de tu salón.</p>`);break;
 case 'prop':{const x=S.proposals.find(q=>q.id===id),ok=t.dataset.ok==='1';x.status=ok?'approved':'rejected';if(ok)S.custom.push({id:3000+Date.now()%100000,sec:x.sec,band:bandOfGrp(x.sec,x.salon)||undefined,cat:x.cat||'Comunidad',trk:x.trk,lvl:x.lvl,min:x.min||15,pts:LVP[x.lvl],t:x.t,d:x.d,salon:x.salon});S.log.push({title:'Reto propuesto: '+x.t,status:ok?'approved':'rejected',comment:x.from==='maestro'?'Propuesto por el maestro de '+x.salon:'Propuesto por un alumno de '+x.salon,by:'Coordinación',at:Date.now()});notify(ok?`Coordinación autorizó el reto «${x.t}». Ya está en la baraja.`:`Coordinación no autorizó el reto «${x.t}».`,x.owner);save();renderAll();toast(ok?'Reto autorizado: ya aparece en la baraja.':'Propuesta no autorizada.');break}
 case 'req':{const q=S.accounts.find(x=>x.id===id),ok=t.dataset.ok==='1';q.status=ok?'approved':'rejected';S.log.push({title:`Cuenta de maestro: ${q.name}`,status:q.status,comment:`${SEC[q.sec]} · ${q.grp}`,by:'Coordinación',at:Date.now()});save();renderAll();toast(ok?'Cuenta de maestro autorizada.':'Solicitud rechazada.');break}
 case 'gotas':gotasSheet();break;
 case 'racha':rachaSheet();break;
 case 'expand':bagSheet();break;
 case 'collapse':springForce='mini';forceY=scrollY;springMode();break;
 case 'forgot':forgotSheet();break;
 
 case 'roles':rolesSheet();break;
 case 'setrole':setRole(id);break;
 case 'logout':DB.signOut().then(()=>{S=fresh();S.cur=null;S.logged=false;ptab=null;closeSheet();renderAll(true);window.scrollTo(0,0);toast('Cerraste sesión.')});break;
 case 'ptab':ptab=id;renderAll(true);break;
 case 'bag':bagSheet();break;
 case 'notifs':notifSheet();break;
 case 'install':installSheet();break;
 case 'hours':hoursSheet();break;
 case 'cert':certSheet();break;
 case 'speak':{const r=reto(n);if(r)speak(`${r.t}. ${r.d}. ${howOf(r).map((x,i)=>`Paso ${i+1}: ${x}`).join(' ')}`);break}
 case 'val':validate(id,t.dataset.ok==='1');break;
 case 'propose':notify(`Tu familia te propuso un reto: «${reto(n).t}». Cuando lo hagan juntos, cuéntalo con «¡Lo hago!».`);save();renderAll();toast('Listo: le avisamos que se lo propusiste.');break;
 case 'remind':if(!S.remind.includes(id)){S.remind.push(id);notify('Tu maestro te recuerda: ¡esta semana todavía puedes sumar tu gota!',id)}save();renderAll();toast('Recordatorio enviado: le llega a su campana.');break;
 case 'hrs':{const h=S.hours.find(x=>x.id===id),ok=t.dataset.ok==='1';h.status=ok?'approved':'rejected';S.log.push({title:`Servicio social: ${h.org} (${h.hrs} h)`,status:h.status,comment:'',by:'Coordinación',at:Date.now()});notify(ok?`Confirmaron ${h.hrs} h de servicio social en ${h.org}.`:`Revisa tu registro de horas en ${h.org}.`,h.owner);save();renderAll();toast(ok?'Horas confirmadas.':'Registro rechazado.');break}
 case 'feat':S.featured=S.featured.includes(id)?S.featured.filter(x=>x!==id):[...S.featured,id];save();storiesSheet();break;
 case 'season':filter='fiesta';skipped=[];renderTop();renderDeck(true);document.getElementById('deck').scrollIntoView({behavior:'smooth',block:'center'});break;
 case 'realdate':S.simDate='';save();renderAll();toast('De vuelta a la fecha real.');break;
 case 'how':howSheet(n);break;
 case 'howfront':{const q=queue();if(q.length&&S.role==='alumno')howSheet(q[0].id);break}
 case 'accepth':startDone(n);break;
 case 'salones':salonSheet();break;
 case 'stories':storiesSheet();break;
 case 'sfil':storiesSheet.f=id;storiesSheet();break;
 case 'like':S.likes=S.likes.includes(id)?S.likes.filter(x=>x!==id):[...S.likes,id];save();storiesSheet();break;
 case 'tray':{const st=stOf(n);if(st==='review')toast('Ya lo subiste. Está pendiente de autorización.');else startDone(n);break}
 case 'trayown':{const s=S.subs.find(x=>x.id===id);if(s.status==='pending')toast('Ya la enviaste. Está en revisión.');else startDone(null,id);break}
 case 'own':startDone(null);break;
 case 'acceptc':if(reto(n).fest&&reto(n).fest!==fkey(nextFest())){toast('Este reto se desbloquea en su temporada.');break}startDone(n);break;
 case 'dcat':keep();D.cat=id;step1();break;
 case 'rmphoto':keep();D.photo=null;D.faces=false;D.show=false;step1();break;
 case 'step2':{keep();D.text=D.text.trim();D.title=D.title.trim();
  if(!D.rid&&D.title.length<4){toast('Escribe un título corto.');return}if(D.text.length<15){toast('Cuéntanos un poco más: al menos una oración.');return}if(!D.vol){toast('Solo puedes subirlo cuando ya lo hiciste. Marca «Ya lo hice».');return}if(D.photo&&!D.faces){toast('Confirma que las personas de la foto están de acuerdo en salir.');return}step2();break}
 case 'back1':step1();break;
 case 'send':if(!document.getElementById('d-ok').checked){toast('Marca la casilla de revisión.');return}send();break;
 case 'close':case 'bgclose':closeSheet();break;
 
 case 'reject':decide(id,false);break;
 case 'approve':decide(id,true);break;
 case 'goal':S.goal=Math.max(1,Math.min(30,S.goal+n));save();meSheet();break;
 case 'create':sheet(`<div class="eyebrow">Coordinador</div><h2 style="font-size:26px">Nuevo reto</h2><form class="stack" id="fcreate"><label class="f" for="ct">Título del reto<input class="in" id="ct" required minlength="5" maxlength="80"></label><label class="f" for="cd">Instrucciones para el alumno<textarea class="in" id="cd" required minlength="15" maxlength="400"></textarea></label><label class="f" for="cs">Sección<select class="in" id="cs">${SECS.map(s=>`<option value="${s}">${SEC[s]}</option>`).join('')}</select></label><label class="f" for="cc">Tema<select class="in" id="cc">${Object.keys(CAT).map(c=>`<option value="${c}">${CATN[c]}</option>`).join('')}</select></label><div class="row"><label class="f" for="ck" style="flex:1">Camino<select class="in" id="ck">${Object.keys(TRK).map(k=>`<option value="${k}">${TRK[k]}</option>`).join('')}</select></label><label class="f" for="cl" style="flex:1">Nivel<select class="in" id="cl">${[1,2,3].map(l=>`<option value="${l}">${l} · ${LV[l]} (+${LVP[l]})</option>`).join('')}</select></label></div><label class="f" for="cm">Minutos<input class="in" id="cm" type="number" min="1" max="240" value="10"></label><button class="btn full">Publicar en la baraja</button></form>`);break;
 case 'aviso':sheet(`<div class="eyebrow">Coordinador</div><h2 style="font-size:26px">Aviso para todos</h2><form class="stack" id="faviso"><label class="f" for="at">Mensaje<textarea class="in" id="at" required maxlength="200" placeholder="Ej.: Esta semana, colecta de juguetes para Janucá en la entrada."></textarea></label><button class="btn full">Publicar aviso</button></form>`);break;
 case 'log':sheet(`<div class="eyebrow">Coordinador</div><h2 style="font-size:26px">Historial de revisiones</h2><section class="card">${S.log.length?S.log.slice().reverse().map(l=>`<div class="hist"><p><b>${esc(l.title)}</b><br><span class="hint">${esc(l.comment||'Sin comentario')}</span></p>${statusPill(l.status)}</div>`).join(''):'<p class="hint">Aquí queda cada aprobación o regreso.</p>'}</section>`);break;
 
 
 case 'tv':closeSheet();location.hash='tv';break;
 case 'tvexit':location.hash='';break;
 }});
document.addEventListener('input',e=>{
 if(e.target.id==='d-names')document.getElementById('d-prev').textContent=scrub(D.text,e.target.value.split(','));
 if(e.target.id==='nm'){S.name=e.target.value.trim()||'Ana';save();renderTop()}});
document.addEventListener('change',e=>{const dt=e.target.dataset||{};
 if(e.target.id==='rg-sec'){renderLogin.s=e.target.value;document.getElementById('rg-grp').innerHTML=GRPS[e.target.value].map(g=>`<option>${g}</option>`).join('');return}
 if(dt.pref){S.notifSet[dt.pref]=e.target.checked;save();return}
 if(dt.consent){S.consent[dt.consent]=e.target.checked;notify('Tu familia actualizó tus permisos.');save();renderAll();toast('Permiso actualizado.');return}
 if(dt.top){S.settings.top[dt.top]=e.target.checked;save();toast('Ajuste guardado.');return}
 if(dt.set){const k=dt.set;S.settings[k]=e.target.type==='checkbox'?e.target.checked:e.target.type==='number'?Math.max(1,+e.target.value||1):(e.target.value.trim()||S.settings[k]);save();toast('Ajuste guardado.');return}
 if(e.target.id==='simdate'){S.simDate=e.target.value||'';save();skipped=[];renderAll();toast('Temporada actual: '+nextFest().n+'.');return}
 if(e.target.id==='kmode'){S.kinder=e.target.checked;save();closeSheet();renderAll();toast(S.kinder?'Modo Kínder activado.':'Modo Kínder desactivado.');return}
 if(e.target.id==='d-photo'&&e.target.files&&e.target.files[0])readPhoto(e.target.files[0]);if(e.target.id==='mysec'){S.mySec=e.target.value;skipped=[];save();renderAll(true);toast('Ahora ves retos de '+SEC[S.mySec]+'.')}});
document.addEventListener('submit',async e=>{e.preventDefault();
 if(e.target.id==='flogin'){const m=document.getElementById('lg-mail').value.trim().toLowerCase(),p=document.getElementById('lg-pass').value,er=document.getElementById('lg-err'),b=e.target.querySelector('button');b.disabled=true;er.textContent='';try{await DB.signIn(m,p);setAccount(S.cur)}catch(x){if(x.message==='NEEDREG'){closeSheet();askReg()}else er.textContent=x.message}finally{b.disabled=false}return}
 if(e.target.id==='fforgot'){const m=document.getElementById('fg-mail').value.trim().toLowerCase(),er=document.getElementById('fg-err');try{await DB.resetPassword(m);sheet(`<div class="eyebrow">Revisa tu correo</div><h2 style="font-size:26px">📬 Te mandamos un link</h2><p class="muted" style="font-weight:700">Si <b>${esc(m)}</b> tiene cuenta, te llegará un correo para crear una contraseña nueva. Revisa también spam.</p><button class="btn full" data-act="close">Entendido</button>`)}catch(x){er.textContent=x.message}return}
 if(e.target.id==='fnewpass'){const a=document.getElementById('np-1').value,b2=document.getElementById('np-2').value,er=document.getElementById('np-err');if(a!==b2){er.textContent='Las contraseñas no coinciden.';return}try{await DB.newPassword(a);history.replaceState(null,'',location.pathname);closeSheet();toast('¡Listo! Tu contraseña se cambió.');if(!S.logged&&await DB.start())setAccount(S.cur)}catch(x){er.textContent=x.message}return}
 if(e.target.id==='finv'){const [sc,gr]=document.getElementById('iv-s').value.split('|');if(teacherOf(sc,gr)){toast(`${gr} de ${SEC[sc]} ya tiene maestro.`);return}const AB='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',rnd=[...crypto.getRandomValues(new Uint8Array(6))].map(b=>AB[b%AB.length]).join(''),code='MJ-'+gr.replace(/[^0-9A-Za-z]/g,'').replace('º','').toUpperCase()+'-'+rnd;S.invites.push({code,sec:sc,grp:gr,used:null,at:Date.now()});S.log.push({title:'Clave de maestro creada',status:'approved',comment:code+' · '+SEC[sc]+' '+gr,by:'Coordinación',at:Date.now()});save();renderAll();toast('Clave creada: '+code)}
 if(e.target.id==='fret'){const g=k=>document.getElementById(k).value.trim(),id=g('re-id'),a=g('re-a'),lv=+g('re-l')||1,o={t:g('re-t'),d:g('re-d'),cat:g('re-c'),min:+g('re-m')||10,obj:g('re-o'),dim:g('re-dm'),val:g('re-v'),how:[0,1,2].map(i=>g('re-h'+i)).filter(Boolean)};
  if(a==='fiesta')Object.assign(o,{fest:g('re-f'),pts:+g('re-p')||20,sec:undefined,trk:undefined,lvl:undefined});else Object.assign(o,{sec:a.startsWith('Primaria')?'Primaria':a,band:a.startsWith('Primaria-')?a.split('-')[1]:undefined,trk:g('re-k'),lvl:lv,pts:LVP[lv],fest:undefined});
  if(!o.how.length)o.how=undefined;
  if(id==='new')S.cat.push({id:4000+Date.now()%100000,...o});else Object.assign(reto(+id),o);
  S.log.push({title:(id==='new'?'Reto agregado: ':'Reto editado: ')+o.t,status:'approved',comment:(AREAS.find(x=>x[0]===a)||[0,a])[1]+(a==='fiesta'?'':' · '+TRK[o.trk]+' · nivel '+lv),by:'Coordinación',at:Date.now()});
  catSec=a;save();closeSheet();renderAll();toast(id==='new'?'Reto agregado al catálogo.':'Cambios guardados.')}
 if(e.target.id==='fsalon'){const lv=+document.getElementById('sr-l').value||1,g=myGroup();S.proposals.push({id:'p'+Date.now()+Math.random().toString(36).slice(2,6),from:'maestro',salon:g,sec:S.mySec,cat:'Comunidad',trk:document.getElementById('sr-k').value,lvl:lv,min:15,t:document.getElementById('sr-t').value.trim(),d:document.getElementById('sr-d').value.trim(),status:'pending',at:Date.now()});save();renderAll();toast('Enviado. Coordinación lo autorizará.')}
 if(e.target.id==='fprop'){S.proposals.push({id:'p'+Date.now()+Math.random().toString(36).slice(2,6),owner:curSid(),from:'alumno',who:S.name,salon:myGroup(),sec:S.mySec,cat:'Comunidad',trk:document.getElementById('pp-k').value,lvl:1,min:10,t:document.getElementById('pp-t').value.trim(),d:document.getElementById('pp-d').value.trim(),status:'pending',at:Date.now()});save();closeSheet();toast('¡Gracias! Coordinación revisará tu propuesta.')}
 if(e.target.id==='freg')register();
 if(e.target.id==='faviso2'){const tx=document.getElementById('at2').value.trim();S.avisos.push({text:tx,at:Date.now(),to:myGroup(),sec:S.mySec});notifyMany('Aviso de tu maestro: '+tx,a=>a.sec===S.mySec&&a.grp===myGroup());save();renderAll();toast('Aviso enviado a '+myGroup()+'.')}
 if(e.target.id==='fhours'){const v=k=>document.getElementById(k).value.trim();S.hours.push({id:'h'+Date.now()+Math.random().toString(36).slice(2,6),owner:curSid(),org:v('h-org'),date:v('h-date'),hrs:Math.max(.5,+v('h-hrs')||1),act:v('h-act'),resp:v('h-resp'),status:'pending',at:Date.now()});save();hoursSheet();toast('Enviado. Lo confirmará tu responsable y después coordinación.')}

 if(e.target.id==='fcreate'){const lv=+document.getElementById('cl').value||1,r={id:1000+Date.now()%100000,sec:document.getElementById('cs').value,cat:document.getElementById('cc').value,trk:document.getElementById('ck').value,lvl:lv,min:+document.getElementById('cm').value||10,pts:LVP[lv],t:document.getElementById('ct').value.trim(),d:document.getElementById('cd').value.trim()};S.custom.push(r);save();closeSheet();renderAll();toast('Reto publicado en la baraja de '+SEC[r.sec]+'.')}
 if(e.target.id==='faviso'){const tx=document.getElementById('at').value.trim();S.avisos.push({text:tx,at:Date.now()});notifyMany('Aviso del colegio: '+tx,()=>true);save();closeSheet();renderAll();toast('Aviso publicado para todos.')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.sheet'))closeSheet()});

/* ---------- Inicio ---------- */
function seedVisits(){}
(async function boot(){renderAll(true);route();const ok=await DB.start();if(ok){setAccount(S.cur,true)}else{renderAll(true);if(DB.needReg())askReg()}if(DB.recovery)newPassSheet();
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.logged&&DB.stale())DB.reload(true)});setInterval(()=>{if(!document.hidden&&S.logged&&!document.querySelector('.sheet'))DB.reload(true)},60000);
 storyTimer=setInterval(()=>{storyIdx++;showStory()},5000)})();
</script>
